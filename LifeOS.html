}
function migrateFuel(f){
  return Object.assign({station:'', createdAt:Date.now()}, f);
}
/* ---- Phase 7: Health per-record migrations. Same idempotent Object.assign(defaults, record)
   pattern as every other module -- the record's own values always win, ids/dates/history never
   touched. sleepLog existed since an earlier phase (add-only, {id,date,bedtime,wake,quality,
   createdAt}) and simply gains `notes`; the other four logs are brand new so old backups
   never have any records to migrate here at all (their arrays are freshly created empty via
   the generic top-level Object.keys(d) fill-in in migrate() below). ---- */
function migrateSleepEntry(s){
  return Object.assign({notes:'', quality:null, createdAt:Date.now()}, s);
}
function migrateWeightEntry(w){
  return Object.assign({unit:'kg', createdAt:Date.now()}, w);
}
function migrateStepsEntry(st){
  return Object.assign({createdAt:Date.now()}, st);
}
function migrateHeartRateEntry(hr){
  return Object.assign({type:'general', createdAt:Date.now()}, hr);
}
function migrateActiveCaloriesEntry(ac){
  return Object.assign({createdAt:Date.now()}, ac);
}
function migrate(state){
  // v1->v2: ensure all collections from later modules exist (safe defaults for old backups)
  const d=defaultState();
  const merged=Object.assign({},d,state);
  Object.keys(d).forEach(k=>{ if(merged[k]===undefined) merged[k]=d[k]; });
  // v3->v4: upgrade every habit record to the richer model (see migrateHabit). This runs on
  // every load (idempotent — already-migrated habits pass through Object.assign unchanged)
  // so old backups gain the new fields without losing any completion history.
  merged.habits=(merged.habits||[]).map(migrateHabit);
  // v4->v5 (Phase 3): upgrade every record in the modules that gained new editable fields.
  // Same idempotent Object.assign-with-defaults pattern — no ids, no completions/xpLog
  // entries, no linked-record references are ever touched or lost.
  merged.events=(merged.events||[]).map(migrateEvent);
  merged.expenses=(merged.expenses||[]).map(migrateFinanceEntry);
  merged.income=(merged.income||[]).map(migrateFinanceEntry);
  merged.budgets=(merged.budgets||[]).map(migrateBudget);
  merged.subscriptions=(merged.subscriptions||[]).map(migrateSub);
  merged.workouts=(merged.workouts||[]).map(migrateWorkout);
  // Phase 11A: a state that predates the exercise library gets one bare-name record per distinct
  // exercise of its own history (no invented muscles); an existing library is only normalized.
  merged.exerciseLibrary=Array.isArray(state&&state.exerciseLibrary)?merged.exerciseLibrary.map(migrateExercise):exerciseSeedFromHistory(merged.workouts);
  merged.meals=(merged.meals||[]).map(migrateMeal);
  merged.notes=(merged.notes||[]).map(migrateNote);
  merged.journal=(merged.journal||[]).map(migrateJournalEntry);
  merged.vehicles=(merged.vehicles||[]).map(migrateVehicle);
  merged.carServices=(merged.carServices||[]).map(migrateService);
  merged.fuelEntries=(merged.fuelEntries||[]).map(migrateFuel);
  // v5->v6 (Phase 5): real RPG system. merged.rpg/merged.achievementUnlockedAt already default
  // to a fresh, empty structure via the top-level Object.keys(d) fill-in above when totally
  // absent (a v5-or-earlier backup never had these keys at all) -- nothing pre-existing is
  // overwritten or lost. Guard against a partially-shaped legacy value defensively too.
  if(!merged.rpg || typeof merged.rpg!=='object') merged.rpg=d.rpg;
  merged.rpg.skillPoints=Object.assign({available:0,earned:0,spent:0},merged.rpg.skillPoints||{});
  merged.rpg.attributePoints=Object.assign({available:0,earned:0,spent:0},merged.rpg.attributePoints||{});
  merged.rpg.skillTree=Object.assign({unlocked:[],totalSpent:0},merged.rpg.skillTree||{});
  merged.rpg.activityLog=merged.rpg.activityLog||[];
  merged.rpg.highestLevelRewarded=merged.rpg.highestLevelRewarded||1;
  merged.achievementUnlockedAt=merged.achievementUnlockedAt||{};
  // Backfill: an account that already reached a level before Phase 5 existed gets its Skill
  // Points / Attribute Points retroactively, computed purely from its real, existing totalXp
  // (never a fabricated number) -- idempotent, since re-running migrate() again is then a no-op.
  applyLevelRewards(merged);
  // v6->v7 (Phase 6): Settings / Notifications / Onboarding / Daily targets. The top-level
  // Object.assign({},d,state) above already replaced merged.settings wholesale with the OLD
  // settings object when state had one (shallow overwrite), so it is missing every new
  // sub-field -- deep-merge each level explicitly, exactly like the rpg block above, so no
  // existing setting (theme, onboarded, widgets show/hide) is ever lost or reset.
  merged.settings=Object.assign({},d.settings,merged.settings||{});
  merged.settings.widgets=Object.assign({},d.settings.widgets,merged.settings.widgets||{});
  {
    // widgetOrder: keep the account's own order for widgets it already knows about, then
    // append any brand-new widget keys (or a totally-missing order) in the default position.
    const existingOrder=(merged.settings.widgetOrder||[]).filter(k=>d.settings.widgets.hasOwnProperty(k));
    d.settings.widgetOrder.forEach(k=>{ if(!existingOrder.includes(k)) existingOrder.push(k); });
    merged.settings.widgetOrder=existingOrder;
  }
  merged.settings.notifications=Object.assign({},d.settings.notifications,merged.settings.notifications||{});
  if(!merged.settings.notificationsPermission) merged.settings.notificationsPermission=d.settings.notificationsPermission;
  merged.profile=Object.assign({},d.profile,merged.profile||{});
  merged.dailyTargets=Object.assign({},d.dailyTargets,merged.dailyTargets||{});
  merged.notificationLog=merged.notificationLog||[];
  // v7->v8 (Phase 7): Health model. sleepLog gains `notes` (+`quality` normalized); the four
  // other logs are brand-new top-level arrays -- already defaulted to [] by the generic
  // Object.keys(d) fill-in above when totally absent, so no data is ever lost or invented.
  merged.sleepLog=(merged.sleepLog||[]).map(migrateSleepEntry);
  merged.weightLog=(merged.weightLog||[]).map(migrateWeightEntry);
  merged.stepsLog=(merged.stepsLog||[]).map(migrateStepsEntry);
  merged.heartRateLog=(merged.heartRateLog||[]).map(migrateHeartRateEntry);
  merged.activeCaloriesLog=(merged.activeCaloriesLog||[]).map(migrateActiveCaloriesEntry);
  // Phase 11A: Muscle XP ledger (a partially shaped value is repaired), then the one-time recovery of
  // finished new-model workouts that have no log record yet (idempotent by key).
  if(!merged.muscleProgress||typeof merged.muscleProgress!=='object') merged.muscleProgress={log:[]};
  if(!Array.isArray(merged.muscleProgress.log)) merged.muscleProgress.log=[];
  // Phase 11B: Finance 2.0. A state without categories gets the default set + every category name its
  // own history uses. Old transactions/budgets are NOT rewritten: they resolve their category by exact
  // name on read (financeCategoryOf); the id is only written when the user renames that category.
  merged.financeCategories=Array.isArray(state&&state.financeCategories)?merged.financeCategories.map(migrateFinanceCategory):financeSeedCategories(merged);
  merged.accounts=(merged.accounts||[]).map(migrateAccount);
  merged.recurringFinance=(merged.recurringFinance||[]).map(migrateRecurring);
  merged.savingsGoals=(merged.savingsGoals||[]).map(migrateSavingsGoal);
  merged.investments=(merged.investments||[]).map(migrateInvestment);
  muscleRecover(merged);
  merged.schemaVersion=d.schemaVersion;
  return merged;
}

// ---- Date/time display formatting. Internal storage is ALWAYS the plain ISO 'YYYY-MM-DD' /
// 'HH:MM' string, unaffected by these settings -- only what's painted on screen changes, so
// changing the setting never rewrites or migrates a single stored record. ----
function formatDateDisplay(iso){
  if(!iso) return '';
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if(!m) return iso;
  const [,y,mo,d]=m;
  const fmt=(S&&S.settings&&S.settings.dateFormat)||'DD.MM.YYYY';
  if(fmt==='YYYY-MM-DD') return `${y}-${mo}-${d}`;
  if(fmt==='DD.MM.YYYY') return `${d}.${mo}.${y}`;
  // 'locale'/default fallback: let the browser render its own locale-appropriate format.
  try{ return new Date(iso+'T00:00').toLocaleDateString(); }catch(e){ return `${d}.${mo}.${y}`; }
}
function formatTimeDisplay(hhmm){
  if(!hhmm) return '';
  const m=/^(\d{1,2}):(\d{2})/.exec(hhmm);
  if(!m) return hhmm;
  const fmt=(S&&S.settings&&S.settings.timeFormat)||'24h';
  if(fmt==='24h') return `${String(m[1]).padStart(2,'0')}:${m[2]}`;
  let h=parseInt(m[1],10); const ap=h>=12?'PM':'AM'; h=h%12; if(h===0) h=12;
  return `${h}:${m[2]} ${ap}`;
}

// ---- Dashboard widget order: a single ordered list of widget keys, persisted in
// S.settings.widgetOrder. moveWidget just swaps two adjacent entries -- no drag-and-drop
// needed, matching the spec's explicit "stačí ↑ / ↓". ----
function moveWidget(key,dir){
  const order=(S.settings.widgetOrder&&S.settings.widgetOrder.length)?S.settings.widgetOrder.slice():WIDGET_DEFS.map(w=>w.key);
  const i=order.indexOf(key);
  if(i<0) return false;
  const j=i+dir;
  if(j<0||j>=order.length) return false;
  const tmp=order[i]; order[i]=order[j]; order[j]=tmp;
  S.settings.widgetOrder=order;
  return true;
}

// ---- Reminder engine: the single place that evaluates every kind of reminder in the app,
// from real stored data only -- no fabricated/example reminders. Each entry also carries the
// exact type+id needed to navigate to the real object via the existing searchNavigate(). ----
function getActiveReminders(now){
  const ds = now ? (now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')) : todayStr();
  const N=(S.settings&&S.settings.notifications)||{};
  const out=[];
  if(N.task!==false){
    S.tasks.filter(x=>!x.done && x.dueDate && x.dueDate<ds).forEach(x=>out.push({prefType:'task',navType:'task',id:x.id,text:`⏰ Overdue: ${x.title}`}));
  }
  if(N.event!==false){
    S.events.filter(x=>x.date===ds).forEach(x=>out.push({prefType:'event',navType:'event',id:x.id,text:`📅 Today: ${x.title}${x.start?' at '+formatTimeDisplay(x.start):''}`}));
    S.events.map(x=>({x,next:eventUpcomingDate(x)})).filter(o=>o.next && o.next>ds).forEach(({x,next})=>{
      const diff=Math.round((new Date(next)-new Date(ds))/86400000);
      if(diff>=1&&diff<=3) out.push({prefType:'event',navType:'event',id:x.id,text:`📅 ${x.title} in ${diff}d`});
    });
  }
  if(N.habit!==false){
    S.habits.filter(x=>x.active!==false && x.reminder && !isDayComplete(x,ds)).forEach(x=>out.push({prefType:'habit',navType:'habit',id:x.id,text:`🔥 Habit: ${x.name} (${formatTimeDisplay(x.reminder)})`}));
  }
  if(N.subscription!==false){
    S.subscriptions.filter(x=>x.active!==false).forEach(x=>{
      const n=nextPaymentDate(x); if(!n) return;
      const diff=Math.round((new Date(n)-new Date(ds))/86400000);
      if(diff>=0&&diff<=3) out.push({prefType:'subscription',navType:'subscription',id:x.id,text:`💳 ${x.name} renews ${diff===0?'today':'in '+diff+'d'}`});
    });
  }
  if(N.car!==false){
    S.vehicles.forEach(v=>{ carReminders(v).forEach(r=>out.push({prefType:'car',navType:'vehicle',id:v.id,text:r})); });
  }
  if(N.goal!==false){
    S.goals.filter(x=>x.status==='Active' && x.targetDate).forEach(x=>{
      const diff=Math.round((new Date(x.targetDate)-new Date(ds))/86400000);
      if(diff>=0&&diff<=7) out.push({prefType:'goal',navType:'goal',id:x.id,text:`🎯 Goal due: ${x.title} (${diff}d)`});
    });
  }
  if(N.quest!==false){
    DAILY_QUESTS.forEach(q=>{
      const key=questKey(q.id,'daily');
      if(!S.quests.some(x=>x.key===key)) out.push({prefType:'quest',navType:'quest',id:q.id,text:`📜 Quest: ${q.title}`});
    });
  }
  return out;
}
function resolveReminderEntity(navType,id){
  const map={task:S.tasks,event:S.events,habit:S.habits,subscription:S.subscriptions,vehicle:S.vehicles,goal:S.goals};
  const arr=map[navType];
  return arr?arr.find(x=>x.id===id):null;
}

// ---- Browser notifications (local Notification API only -- no server push, per spec). ----
function notificationsSupported(){ return typeof Notification!=='undefined'; }
function requestNotificationPermission(){
  return new Promise(resolve=>{
    if(!notificationsSupported()){ resolve('unsupported'); return; }
    try{
      const res=Notification.requestPermission(resolve); // legacy callback form (old Safari)
      if(res && typeof res.then==='function') res.then(resolve).catch(()=>resolve('denied'));
    }catch(e){ resolve('denied'); }
  });
}
function enableNotificationsClick(){
  requestNotificationPermission().then(p=>{
    S.settings.notificationsPermission=p;
    scheduleSave(); render();
    toast(p==='granted'?tr('notif_granted'):p==='unsupported'?tr('notif_unsupported'):tr('notif_denied'));
  });
}
// Idempotent: a given key (e.g. "notification:task:<id>:<date>") is only ever actually shown
// once -- re-checking the same reminder later the same period is always a safe no-op.
function sendBrowserNotification(title,body,key){
  if(!notificationsSupported()) return false;
  if(Notification.permission!=='granted') return false;
  if(key){
    if(S.notificationLog.some(n=>n.key===key)) return false;
    S.notificationLog.push({key,ts:Date.now()});
    if(S.notificationLog.length>500) S.notificationLog=S.notificationLog.slice(-500);
  }
  try{ new Notification(title,{body}); }catch(e){ return false; }
  return true;
}
// Fires real, deduped browser notifications for every currently-active, preference-enabled
// reminder. Safe to call as often as needed (render, boot, the minute-tick) -- the idempotency
// key ensures the same reminder is never shown twice within the same day.
function checkBrowserNotifications(){
  if(!S || !notificationsSupported() || Notification.permission!=='granted') return;
  const ds=todayStr();
  getActiveReminders().forEach(r=>{
    sendBrowserNotification('LifeOS', r.text, `notification:${r.prefType}:${r.id}:${ds}`);
  });
}

function seedData(){

function flushSave(){ if(!S) return; clearTimeout(saveTimer); idbSet('state',S); }
// Safety net: iOS suspends page JS almost immediately on backgrounding/closing, so a pending
// debounced setTimeout can be lost entirely if the app is closed shortly after an edit.
// Force an immediate (non-debounced) write the moment the page is hidden or torn down.

function addDays(dstr,n){const d=new Date(dstr+'T00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ---- Habit frequency / completion model (Phase 2) ----
   h.frequency: 'daily' | 'weekdays' | 'weekly' | 'custom'
   h.target: for daily/weekdays, "completion units per day" (e.g. water 8x/day); for
             weekly/custom, "completion days per week" (e.g. workout 3x/week).
   h.completions: array of YYYY-MM-DD strings. May contain the SAME date more than once
             for counter-style daily habits (target>1) — each push is one unit that day.
   h.brokenDates: (bad habits only) explicit "broke it" log, separate from completions
             ("maintained/clean" log), so both are real user-entered facts, never inferred. */
function isScheduledDate(h,dateStr){
  if(h.frequency==='weekdays'){
    const dow=new Date(dateStr+'T00:00').getDay(); // 0=Sun..6=Sat
    return (h.weekdays||[]).includes(dow);
  }
  return true; // daily, weekly, custom: every calendar day is a valid tracking day
}
function habitUsesDayCounter(h){ return h.type!=='bad' && (h.frequency==='daily'||h.frequency==='weekdays') && (h.target||1)>1; }
function isDayComplete(h,dateStr){
  if(h.type==='bad') return (h.completions||[]).includes(dateStr); // explicit "clean" log for that day
  if(habitUsesDayCounter(h)) return (h.completions||[]).filter(d=>d===dateStr).length>=(h.target||1);
  return (h.completions||[]).includes(dateStr);
}
function habitWeekStart(dateStr){
  const d=new Date(dateStr+'T00:00'); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function habitWeekCount(h,weekStartDate){
  const we=addDays(weekStartDate,7);
  return [...new Set((h.completions||[]).filter(d=>d>=weekStartDate&&d<we))].length;
}
function habitWeekMeetsTarget(h,weekStartDate){ return habitWeekCount(h,weekStartDate)>=(h.target||1); }

function bestStreakDaily(h){
  const days=[...new Set((h.completions||[]).filter(d=>isDayComplete(h,d)))].sort();
  if(!days.length) return 0;
  let best=1,cur=1;
  for(let i=1;i<days.length;i++){
    const prev=new Date(days[i-1]+'T00:00'), cur2=new Date(days[i]+'T00:00');
    if((cur2-prev)/86400000===1){cur++;best=Math.max(best,cur);}else{cur=1;}
  }
  return isDayComplete(h,todayStr())||isDayComplete(h,addDays(todayStr(),-1))?best:0;
}
function currentStreakDaily(h){
  let d=todayStr(),n=0,guard=0;
  if(!isDayComplete(h,d)) d=addDays(d,-1); // grace: streak still counts if not done *today* yet
  while(isDayComplete(h,d)&&guard<3660){n++;d=addDays(d,-1);guard++;}
  return n;
}
function currentStreakWeekdays(h){
  let d=todayStr();
  if(isScheduledDate(h,d)&&!isDayComplete(h,d)) d=addDays(d,-1); // grace for today
  let n=0,guard=0;
  while(guard<3660){
    if(h.startDate && d<h.startDate) break;
    if(isScheduledDate(h,d)){ if(isDayComplete(h,d)){n++;d=addDays(d,-1);} else break; }
    else d=addDays(d,-1);
    guard++;
  }
  return n;
}
function bestStreakWeekdays(h){
  const doneScheduled=[...new Set((h.completions||[]).filter(d=>isScheduledDate(h,d)&&isDayComplete(h,d)))].sort();
  if(!doneScheduled.length) return 0;
  const start=h.startDate&&h.startDate<doneScheduled[0]?h.startDate:doneScheduled[0];
  let d=start,best=0,cur=0,guard=0;
  while(d<=todayStr()&&guard<3660){
    if(isScheduledDate(h,d)){ if(isDayComplete(h,d)){cur++;best=Math.max(best,cur);} else cur=0; }
    d=addDays(d,1); guard++;
  }
  // "still active" grace, mirroring the daily behavior: only report a nonzero best streak
  // if one of the two most recent *scheduled* occurrences (up to and including today) was done.
  const recent=[]; let dd=todayStr(),g2=0;
  while(recent.length<2&&g2<3660){ if(isScheduledDate(h,dd)) recent.push(dd); dd=addDays(dd,-1); g2++; }
  return recent.some(rd=>isDayComplete(h,rd))?best:0;
}
function currentStreakWeekly(h){
  let ws=habitWeekStart(todayStr()),n=0,guard=0;
  if(!habitWeekMeetsTarget(h,ws)) ws=addDays(ws,-7); // this week not finished yet — don't break the streak on it
  const floorWeek=h.startDate?habitWeekStart(h.startDate):null;
  while(guard<520){
    if(floorWeek && ws<floorWeek) break;
    if(habitWeekMeetsTarget(h,ws)){ n++; ws=addDays(ws,-7); } else break;
    guard++;
  }
  return n;
}
function bestStreakWeekly(h){
  const dates=[...new Set(h.completions||[])].sort();
  const startWeek=habitWeekStart(h.startDate||dates[0]||todayStr());
  const thisWeek=habitWeekStart(todayStr());
  let ws=startWeek,best=0,cur=0,guard=0;
  while(ws<=thisWeek&&guard<520){
    if(habitWeekMeetsTarget(h,ws)){cur++;best=Math.max(best,cur);} else cur=0;
    ws=addDays(ws,7); guard++;
  }
  return best;
}
function bestStreak(h){
  if(h.frequency==='weekdays') return bestStreakWeekdays(h);
  if(h.frequency==='weekly'||h.frequency==='custom') return bestStreakWeekly(h);
  return bestStreakDaily(h);
}
function currentStreak(h){
  if(h.frequency==='weekdays') return currentStreakWeekdays(h);
  if(h.frequency==='weekly'||h.frequency==='custom') return currentStreakWeekly(h);
  return currentStreakDaily(h);
}
function habitProgressLabel(h){
  if(h.type==='bad') return `${currentStreakDaily(h)}d clean streak`;
  if(h.frequency==='weekly'||h.frequency==='custom'){
    const c=habitWeekCount(h,habitWeekStart(todayStr()));
    return `${Math.min(c,h.target||1)} / ${h.target||1} this week`;
  }
  if(habitUsesDayCounter(h)){
    const c=(h.completions||[]).filter(d=>d===todayStr()).length;
    return `${Math.min(c,h.target)} / ${h.target} today`;
  }
  return `🔥${currentStreak(h)} day streak`;
}

function grantXp(amount, reason, attrKey, key){
  // Idempotency guard: if a unique event key is given (e.g. "task:<id>:<date>",
  // "habit:<id>:<date>", "milestone:<id>"), refuse to grant it twice. This checks
  // real xpLog history, not UI/toggle state, so it survives reload and app restarts.
  if(key && S.xpLog.some(x=>x.key===key)) return false;
  S.totalXp += amount;
  S.xpLog.push({id:uid(),amount,reason,ts:Date.now(),key});
  if(attrKey && ATTRS[attrKey]) S.attrs[attrKey]=(S.attrs[attrKey]||0)+Math.round(amount*0.6);
  toast(`+${amount} XP · ${reason}`);
  checkAchievements();
  checkLevelUp();
  return true;
}
let lastLevelSeen=null;
function checkLevelUp(){
  const {level}=levelFromXp(S.totalXp);
  if(lastLevelSeen===null) lastLevelSeen=level;
  if(level>lastLevelSeen){
    // Phase 6: the "animation" for a level-up in this app IS this toast (there is no separate
    // confetti/visual layer) -- animations:false suppresses just that, never the real reward.
    if(animationsOn()) toast(`🎉 Level Up! You're now Level ${level}`);
    if(S.settings.notifications && S.settings.notifications.levelup!==false){
      sendBrowserNotification('⬆️ Level Up!', `You're now Level ${level}`, `notification:levelup:${level}:once`);
    }
    lastLevelSeen=level;
  }
  // Phase 5: persisted, idempotent Skill Point / Attribute Point reward -- independent of the
  // transient lastLevelSeen above, so it is correct even across reload (see applyLevelRewards).
  applyLevelRewards(S);
}
function checkAchievements(){
  ACHV.forEach(a=>{
    if(!S.achievementsUnlocked.includes(a.id) && a.cond(S)){
      S.achievementsUnlocked.push(a.id);
      S.achievementUnlockedAt[a.id]=Date.now(); // Phase 5: real unlock timestamp, set exactly once
      // Phase 6: animations:false suppresses only this toast -- the unlock itself (below) always happens.
      if(animationsOn()) toast(`🏆 Achievement: ${a.title}`);
      if(S.settings.notifications && S.settings.notifications.achievement!==false){
        sendBrowserNotification('🏆 Achievement unlocked', a.title, `notification:achievement:${a.id}:once`);
      }
      logActivity('achievement',a.title,a.desc,a.xp||0);
      if(a.xp) grantXp(a.xp,'Achievement');
    }
  });
}

/* ---------- TOASTS ---------- */
/* ---------- TOASTS (Phase 8B: queued, grouped, localized presentation) ----------
   Every caller still just does toast(msg) exactly as before -- no unlock/XP rule changed.
   This layer only decides how the messages are painted: everything raised in the same tick
   (e.g. boot unlocking many achievements + quests at once) is collected into one burst, a
   large burst is folded into a few summary toasts, and at most UI_TOAST_MAX are on screen. */
const UI_TOAST_MAX=3;
let uiToastBurst=[], uiToastQueue=[], uiToastLive=0, uiToastTimer=null;
function toast(msg){
  uiToastBurst.push(String(msg));
  if(!uiToastTimer) uiToastTimer=setTimeout(uiFlushToasts,0);
}
function uiToastKind(m){
  if(/Level Up/i.test(m)) return 'level';
  if(/^🏆/.test(m)) return 'achievement';
  if(/^📜/.test(m)) return 'quest';
  if(/^\+\d+ XP/.test(m)) return 'xp';
  if(/^🌟/.test(m)) return 'achievement';
  if(/required|failed|could not|first \(|empty|valid/i.test(m)) return 'error';
  return 'info';
}
function uiFlushToasts(){
  uiToastTimer=null;
  const burst=uiToastBurst; uiToastBurst=[];
  const push=(msg,kind)=>uiToastQueue.push({msg,kind});
  if(burst.length<=UI_TOAST_MAX){
    burst.forEach(m=>push(uiLocalizeToast(m),uiToastKind(m)));
  } else {
    const g={level:[],achievement:[],quest:[],xp:[],other:[]};
    burst.forEach(m=>{ const k=uiToastKind(m); (g[k]||g.other).push(m); });
    if(g.level.length) push(uiLocalizeToast(g.level[g.level.length-1]),'level');
    if(g.achievement.length===1) push(uiLocalizeToast(g.achievement[0]),'achievement');
    else if(g.achievement.length) push('🏆 '+uiT('toast_n_achievements',{n:g.achievement.length}),'achievement');
    if(g.quest.length===1) push(uiLocalizeToast(g.quest[0]),'quest');
    else if(g.quest.length) push('📜 '+uiT('toast_n_quests',{n:g.quest.length}),'quest');
    const xp=g.xp.reduce((a,m)=>a+(parseInt(m.slice(1),10)||0),0);
    if(g.xp.length) push(`+${xp} XP`+(g.xp.length>1?' · '+uiT('toast_n_rewards',{n:g.xp.length}):''),'xp');
    g.other.forEach(m=>push(uiLocalizeToast(m),uiToastKind(m)));
  }
  uiPumpToasts();
}
function uiPumpToasts(){
  const wrap=document.getElementById('toasts');
  if(!wrap) return;
  while(uiToastLive<UI_TOAST_MAX && uiToastQueue.length){
    const t=uiToastQueue.shift(); uiToastLive++;
    const n=document.createElement('div');
    n.className='toast is-'+t.kind;
    n.setAttribute('role',t.kind==='error'?'alert':'status');
    n.textContent=t.msg;
    wrap.appendChild(n);
    setTimeout(()=>{ n.classList.add('is-leaving'); setTimeout(()=>{ n.remove(); uiToastLive--; uiPumpToasts(); },220); }, t.kind==='level'?4200:2900);
  }
}

function uiPlT(k){ return (UI_PL[uiLang()]||UI_PL.cs)[k]; }
function uiPlDur(min){ const h=Math.floor(min/60), m=min%60; return h?`${h} h${m?` ${m} min`:''}`:`${m} min`; }
function uiPlColor(cat){ const c=CATS[cat]; return c&&ATTRS[c.a]?ATTRS[c.a].c:'var(--accent)'; }
function uiPlIcon(b){ return (CATS[b.category]||{}).ic||'🗓️'; }
function uiTaskBlocks(t){ return (S.plannerBlocks||[]).filter(b=>b.taskId===t.id).sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime)); }
function uiTaskNextBlock(t){ const today=todayStr(); return uiTaskBlocks(t).find(b=>b.date>=today)||null; }
function uiTaskPlanBlock(t){
  const bl=uiTaskBlocks(t);
  return `<div class="task-plan"><button class="btn ghost" id="f_plan">🗓️ ${uiPlT('plan')}</button>${bl.length?`<div class="sub" style="margin-top:8px">${uiPlT('scheduled')}:</div><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">${bl.map(b=>`<button class="chip" data-plan-day="${b.date}">🗓️ ${fmtDate(b.date)} ${b.startTime}–${b.endTime}${b.completed?' ✓':''}</button>`).join('')}</div>`:''}</div>`;
}
// Home: compact "Today's plan" (inside the existing Today's Tasks widget -- no new widget key).
function uiTodaysPlanCard(){
  const bl=plannerBlocksOn(todayStr());
  if(!bl.length) return null;
  const c=el(`<div class="card plan-card" data-plan="home"><div class="between" style="margin-bottom:4px"><span class="kicker">🗓️ ${uiPlT('todays_plan')}</span><button class="action section-open" style="background:none;border:none;color:var(--accent);font-weight:650;min-height:44px;cursor:pointer">${uiPlT('open')} ›</button></div>
    <div class="plan-list">${bl.slice(0,5).map(b=>{ if(b.workoutTemplateId){ const wi=uiPlannerWorkoutInfo(b);
      return `<div class="plan-row plan-wk${b.completed?' is-done':''}" data-block="${b.id}"><b>${b.startTime}</b><button class="plan-open truncate">🏋️ ${escapeHtml(wi.t?wi.t.name:b.title)}</button>${wi.st==='active'?`<button class="btn sm planWkGo">▶ ${uiPlT('continue_wk')}</button>`:wi.st==='done'?`<span class="chip is-success" data-wk-done>${uiLang()==='cs'?'Dokončeno':'Finished'}</span>`:(b.completed?'<span class="chip is-success">✓</span>':'<span></span>')}</div>`; }
      return `<button class="plan-row${b.completed?' is-done':''}" data-block="${b.id}"><b>${b.startTime}</b><span class="truncate">${uiPlIcon(b)} ${escapeHtml(b.title)}</span>${b.completed?'<span class="chip is-success">✓</span>':'<span></span>'}</button>`; }).join('')}</div>
    ${bl.length>5?`<div class="sub" style="margin-top:4px">+${bl.length-5}</div>`:''}</div>`);
  c.querySelectorAll('button').forEach(b=>b.onclick=()=>uiOpenPlanner(todayStr()));

}
function uiOpenPlanner(D){ uiPlannerDay=D||todayStr(); view='planner'; render(); window.scrollTo(0,0); }
function uiGoActiveWorkout(){ closeSheets(); uiWorkoutView={mode:'active'}; fitnessTab='workouts'; view='fitness'; render(); window.scrollTo(0,0); }
function uiPlannerStartWorkout(b){
  const r=plannerStartWorkout(b.id);
  if(r.ok){ scheduleSave(); uiGoActiveWorkout(); return; }
  if(r.reason==='active_exists'){
    if(r.workout.plannerBlockId===b.id){ uiGoActiveWorkout(); return; }
    closeSheets(); uiConfirmSheet({title:uiPlT('wk_active_t'),text:`${uiPlT('wk_active_q')} „${r.workout.name}“.`,ok:uiPlT('continue_wk')},uiGoActiveWorkout); return;
  }
  toast(uiPlT('tpl_missing'));
}
// the block's workout part: template name (or "not available"), informative state, start/continue action
function uiPlannerWorkoutInfo(b){
  const t=templateFind(b.workoutTemplateId), st=plannerBlockWorkoutState(b);
  return {t,st,tplChip:t?`<span class="chip">📋 ${escapeHtml(t.name)}</span>`:`<span class="chip is-muted" data-tpl-missing>📋 ${uiPlT('tpl_missing')}</span>`,
    stChip:st==='active'?`<span class="chip is-warn">● ${uiPlT('wk_active')}</span>`:st==='done'?`<span class="chip is-success" data-wk-done>🏋️ ${uiPlT('wk_done')}</span>`:'',
    action:st==='active'?uiPlT('continue_wk'):(t?uiPlT('start_wk'):'')};
}
function renderPlanner(){
  const D=uiPlannerDay||todayStr(), today=todayStr();
  const blocks=plannerBlocksOn(D), sum=plannerDaySummary(D);
  const evs=uiEventsOn(D), timedEvs=evs.filter(e=>plannerTimeToMin(e.start)!=null), allDay=evs.filter(e=>plannerTimeToMin(e.start)==null);
  const dayLabel=(()=>{ try{ const s=new Date(D+'T00:00').toLocaleDateString(uiLocale(),{weekday:'long',day:'numeric',month:'long'}); return s.charAt(0).toUpperCase()+s.slice(1); }catch(e){ return fmtDate(D); } })();
  const wrap=el(`<div class="planner">${uiPageHead(uiPlT('title'),'',`<button class="btn sm" id="uiAddBlock">＋ ${uiPlT('add')}</button>`)}
    <section class="card pl-daybar">
      <button class="iconbtn" id="plPrev" aria-label="${uiPlT('prev')}">‹</button>
      <div class="pl-day"><b>${dayLabel}</b><span class="sub">${sum.planned} ${uiPlT('blocks')} · ${uiPlDur(sum.plannedMin)} ${uiPlT('planned')} · ${sum.completed} ${uiPlT('done')}</span></div>
      <button class="iconbtn" id="plNext" aria-label="${uiPlT('next')}">›</button>
    </section>
    ${D!==today?`<button class="btn ghost sm pl-todaybtn" id="plToday">${uiPlT('today')}</button>`:''}
    ${allDay.length?`<div class="pl-allday">${allDay.map(e=>`<span class="chip is-muted">📅 ${escapeHtml(e.title)} · ${uiPlT('allday')}</span>`).join('')}</div>`:''}
    <div id="plBody"></div>
    ${evs.length?`<p class="helper-text" style="margin-top:10px">${uiPlT('calendar_hint')}</p>`:''}
  </div>`);
  wrap.querySelector('#uiAddBlock').onclick=()=>openPlannerForm(null,{date:D});
  wrap.querySelector('#plPrev').onclick=()=>uiOpenPlanner(addDays(D,-1));
  wrap.querySelector('#plNext').onclick=()=>uiOpenPlanner(addDays(D,1));
  const tb=wrap.querySelector('#plToday'); if(tb) tb.onclick=()=>uiOpenPlanner(today);
  const body=wrap.querySelector('#plBody');
  if(!blocks.length&&!timedEvs.length){
    const e=el(`<div class="card">${uiEmpty('🗓️',uiPlT('empty_t'),uiPlT('empty_d'),'＋ '+uiPlT('add'))}</div>`);
    e.querySelector('.emptyCta').onclick=()=>openPlannerForm(null,{date:D});
    body.appendChild(e); return wrap;
  }
  // Timeline: 06:00–22:00 by default, widened to include every block/event of the day.
  const items=[...blocks.map(b=>({id:b.id,start:plannerTimeToMin(b.startTime),end:plannerTimeToMin(b.endTime),b})),
    ...timedEvs.map(e=>{ const s0=plannerTimeToMin(e.start), e0=plannerTimeToMin(e.end); return {id:'ev_'+e.id,start:s0,end:e0!=null&&e0>s0?e0:Math.min(1440,s0+60),ev:e}; })];
  let from=6*60, to=22*60;
  items.forEach(it=>{ from=Math.min(from,Math.floor(it.start/60)*60); to=Math.max(to,Math.ceil(it.end/60)*60); });
  const PX=1.1, lay=plannerLayout(items);
  const tl=el(`<section class="card pl-timeline" aria-label="${dayLabel}"><div class="pl-grid" id="plTimeline" style="height:${Math.round((to-from)*PX)}px"></div></section>`);
  const grid=tl.querySelector('#plTimeline');
  for(let h=from;h<=to;h+=60) grid.appendChild(el(`<div class="pl-hour" style="top:${Math.round((h-from)*PX)}px"><span>${plannerMinToTime(Math.min(h,1439)).replace('23:59','24:00')}</span></div>`));
  if(D===today){ const n=new Date(), nm=n.getHours()*60+n.getMinutes(); if(nm>=from&&nm<=to) grid.appendChild(el(`<div class="pl-now" style="top:${Math.round((nm-from)*PX)}px" aria-hidden="true"></div>`)); }
  items.forEach(it=>{
    const L=lay[it.id], top=Math.round((it.start-from)*PX), h=Math.max(44,Math.round((it.end-it.start)*PX));
    const pos=`top:${top}px;height:${h}px;left:calc(var(--pl-gutter) + (100% - var(--pl-gutter)) * ${L.col} / ${L.cols});width:calc((100% - var(--pl-gutter)) / ${L.cols} - 4px)`;
    if(it.ev){
      const e=it.ev;
      const n=el(`<button class="pl-block is-event" style="${pos}" data-event="${e.id}" aria-label="${uiPlT('from_cal')}: ${escapeHtml(e.title)}"><span class="pl-t">📅 ${escapeHtml(e.title)}</span><span class="pl-m">${formatTimeDisplay(e.start)}${e.end?'–'+formatTimeDisplay(e.end):''} · ${uiPlT('from_cal')}</span></button>`);
      n.onclick=()=>{ uiCalDay=D; uiCalMode='month'; view='calendar'; render(); window.scrollTo(0,0); };
      grid.appendChild(n); return;
    }
    const b=it.b, lk=plannerLinks(b), compact=h<64;
    const linkTxt=[lk.task?` · ${uiPlT('task')}: ${escapeHtml(lk.task.title)}${lk.task.done?' ('+uiPlT('task_done')+')':''}`:'',lk.goal?` · ${uiPlT('goal')}: ${escapeHtml(lk.goal.title)}`:'',lk.workout?` · ${uiPlT('workout')}: ${escapeHtml(lk.workout.name)}`:''].join('');
    const chips=[lk.task?`<span class="chip ${lk.task.done?'is-success':''}">✅ ${escapeHtml(lk.task.title)}${lk.task.done?' · '+uiPlT('task_done'):''}</span>`:(b.taskId?`<span class="chip is-muted">✅ ${uiPlT('missing')}</span>`:''),
      lk.goal?`<span class="chip">🎯 ${escapeHtml(lk.goal.title)}</span>`:'', lk.workout?`<span class="chip">🏋️ ${escapeHtml(lk.workout.name)}</span>`:''].filter(Boolean).join('');
    const wi=b.workoutTemplateId?uiPlannerWorkoutInfo(b):null;
    const n=el(`<div class="pl-block${b.completed?' is-done':''}${compact?' is-compact':''}${wi?' is-workout':''}" style="${pos};--pl-c:${uiPlColor(b.category)}" data-block="${b.id}">
      <button class="check plCheck ${b.completed?'done':''}" aria-pressed="${b.completed}" aria-label="${uiPlT(b.completed?'uncomplete':'complete')}: ${escapeHtml(b.title)}">${b.completed?'✓':''}</button>
      <button class="pl-open" aria-label="${uiPlT('edit')}: ${escapeHtml(b.title)}${linkTxt}"><span class="pl-t">${uiPlIcon(b)} ${escapeHtml(b.title)}${compact&&lk.task&&lk.task.done?' <span title="'+uiPlT('task_done')+'">✅</span>':''}</span><span class="pl-m">${b.startTime}–${b.endTime}${compact?'':' · '+uiPlDur(plannerDuration(b))}</span>${!compact&&(chips||wi)?`<span class="pl-chips">${wi?wi.tplChip+wi.stChip:''}${chips}</span>`:''}</button>
      ${wi&&wi.action?`<button class="iconbtn plWkStart" aria-label="${wi.action}: ${escapeHtml(b.title)}">▶</button>`:''}
    </div>`);
    n.querySelector('.plCheck').onclick=(ev)=>{ ev.stopPropagation(); plannerToggleCompleted(b.id); render(); };
    n.querySelector('.pl-open').onclick=()=>openPlannerForm(b);
    const ws=n.querySelector('.plWkStart'); if(ws) ws.onclick=(ev)=>{ ev.stopPropagation(); uiPlannerStartWorkout(b); };
    grid.appendChild(n);
  });
  body.appendChild(tl);
  return wrap;
}

  inner.querySelector('#pb_cat').value=cur.category||'';

// One plain-language reason per area -- always shown in the detail, including for N/A.
function uiDsReason(k,a){
  const cs=uiLang()==='cs';
  if(k==='tasks'){
    if(a.score==null) return (cs?'Na tento den nebyly naplánované žádné úkoly.':'No tasks were planned for this day.')+(a.openOverdue?` ${cs?`(${a.openOverdue} po termínu z dřívějška se nezapočítává.)`:`(${a.openOverdue} older overdue not counted.)`}`:'');
    return (cs?`${a.done} z ${a.total} hotovo, váženo prioritou (Urgent 2×, High 1,5×).`:`${a.done} of ${a.total} done, weighted by priority (Urgent 2×, High 1.5×).`)
      +(a.lateDone?` ${cs?`Včetně ${a.lateDone} úkolu po termínu dokončeného v tento den.`:`Includes ${a.lateDone} overdue task completed that day.`}`:'')
      +(a.openOverdue?` ${cs?`${a.openOverdue} starší po termínu se nezapočítává.`:`${a.openOverdue} older overdue not counted.`}`:'');
  }
  if(k==='habits'){
    if(a.score==null) return (cs?'Na tento den nebyl naplánovaný žádný návyk.':'No habit was due this day.')+(a.pending?` ${cs?`${a.pending} zlozvyk čeká na záznam.`:`${a.pending} bad habit not logged yet.`}`:'');
    return (cs?`${a.done} z ${a.total} splněno (počítadla se počítají poměrem).`:`${a.done} of ${a.total} done (counters count proportionally).`)+(a.pending?` ${cs?`${a.pending} zlozvyk zatím bez záznamu — nepočítá se.`:`${a.pending} bad habit not logged yet — not counted.`}`:'');
  }
  if(k==='nutrition'){
    if(a.score==null) return a.reason==='no_targets'?(cs?'Nejsou nastavené cíle stravování.':'No nutrition targets set.'):(cs?'Žádné jídlo ani voda zapsané — nehodnotí se.':'No meals or water logged — not scored.');
    const p=a.parts||{}, nt=cs?'nesledováno':'not tracked';
    const line=(label,v,detail)=>`<span class="ds-part"><span>${label}</span><b>${v==null?nt:v+' %'}</b>${v!=null&&detail?`<small>${detail}</small>`:''}</span>`;
    return `<span class="ds-parts">${line(cs?'Kalorie':'Calories',p.calories,a.caloriesTarget?`${uiNum(a.calories)}/${uiNum(a.caloriesTarget)} kcal`:'')}${line('Protein',p.protein,a.proteinTarget?`${a.protein}/${a.proteinTarget} g`:'')}${line(cs?'Voda':'Water',p.water,a.waterTarget?`${uiNum(a.water)}/${uiNum(a.waterTarget)} ml`:'')}</span>`
      +(a.mode==='live'?(cs?'Dnes se kalorie počítají jako průběžný postup k cíli; uzavřený den používá pásmo 90–110 %.':'Today calories count as progress toward the target; a finished day uses the 90–110 % band.'):(cs?'Kalorie jsou nejlepší v pásmu 90–110 % cíle.':'Calories score best within 90–110 % of target.'))
      +(p.water==null?` ${cs?'Nesledované části se nezapočítávají.':'Untracked parts are not counted.'}`:'');
  }
  if(k==='sleep'){
    if(a.score==null) return cs?'Spánek pro tento den není zapsaný.':'No sleep logged for this day.';
    return `${String(a.hours).replace('.',cs?',':'.')} h${a.quality?` · ${cs?'kvalita':'quality'} ${a.quality}/5`:''}. ${cs?'Plné skóre v rozmezí 7–9 h.':'Full score between 7 and 9 h.'}`;
  }
  if(k==='fitness'){
    if(a.score==null) return (cs?'Dnes nebyl naplánovaný trénink — nehodnotí se.':'No workout was planned — not scored.')+(a.bonus?` 💪 ${cs?'Bonus: trénink zapsán (mimo skóre).':'Bonus: workout logged (outside the score).'}`:'');
    return a.workouts?(cs?'Naplánovaný trénink je splněný.':'The planned workout is done.'):(cs?'Trénink byl naplánovaný v kalendáři, ale není zapsaný.':'A workout was planned in the calendar but not logged.');
  }
  return '';
}
// Last n days: finished days from snapshots only (never recomputed), today live.
function uiDsHistory(n){
  const today=todayStr(), out=[];
  for(let i=n-1;i>=0;i--){ const d=addDays(today,-i);
    if(d===today){ const r=dailyScore(d); out.push({date:d,score:r.score,live:true}); }
    else { const sn=S.dailyScores&&S.dailyScores[d]; out.push({date:d,score:sn?sn.score:null,live:false}); } }
  return out;
}

function uiL(s){ return uiLang()==='cs'&&UI_PHRASES_CS[s]!=null?UI_PHRASES_CS[s]:s; }
// Translates the fixed UI text of a freshly built sheet/form in place: direct text nodes of
// headings, labels and buttons, and option labels. An <option> without a value attribute takes
// its value from its text, so its current text is first pinned as the value attribute --
// every select keeps submitting exactly the same (English) stored value as before.
function uiLocalizeTree(root){
  if(uiLang()!=='cs'||!root) return;
  root.querySelectorAll('h2,h3,h4,label,button,option,.uiL').forEach(n=>{
    if(n.tagName==='OPTION'){ if(!n.hasAttribute('value')) n.setAttribute('value',n.textContent); }
    n.childNodes.forEach(c=>{
      if(c.nodeType!==3) return;
      const raw=c.nodeValue, t=raw.trim();
      if(!t) return;
      let tr2=UI_PHRASES_CS[t];
      if(tr2==null){ const m=/^([+＋]\s*)(.+)$/.exec(t); if(m&&UI_PHRASES_CS[m[2]]!=null) tr2=m[1]+UI_PHRASES_CS[m[2]]; }
      if(tr2!=null) c.nodeValue=raw.replace(t,tr2);
    });
  });
  root.querySelectorAll('[placeholder]').forEach(n=>{ const p=n.getAttribute('placeholder'); if(UI_PHRASES_CS[p]!=null) n.setAttribute('placeholder',UI_PHRASES_CS[p]); });
}

function renderHome(){
  const wrap=el(`<div class="home"></div>`);
  const W=Object.assign({},...WIDGET_DEFS.map(w=>({[w.key]:true})),S.settings.widgets||{});
  const sectionHead=(title,meta,navTo)=>`<div class="section-header"><h3>${title}</h3>${navTo?`<button class="action" data-nav="${navTo}">${meta} ›</button>`:`<span class="sub">${meta}</span>`}</div>`;

  // Phase 6: each widget is a small builder returning a node or null (hidden / nothing to show),
  // appended in S.settings.widgetOrder so the Settings ↑/↓ reorder keeps its real effect.
  // Phase 8B: consecutive list widgets share a responsive pair grid and consecutive snapshot
  // widgets share one snapshot grid -- order and visibility rules are unchanged.
  const builders={
    reminders: ()=>{
      if(W.reminders===false) return null;
      const items=getActiveReminders().slice(0,8);
      if(!items.length) return null;
      const rc=el(`<div class="reminder-strip" id="hRem" role="list" aria-label="${uiT('reminders')}"></div>`);
      const rl=rc;
      items.forEach(r=>{
        const row=el(`<button class="reminder" role="listitem"><span>${escapeHtml(uiReminderText(r.text,r))}</span></button>`);
        row.onclick=()=>{
          if(r.navType==='quest'){ searchNavigate('quest',null); return; }
          const obj=resolveReminderEntity(r.navType,r.id);
          if(obj) searchNavigate(r.navType,obj);
        };
        rl.appendChild(row);
      });
      return rc;
    },
    progress: ()=>{
      if(W.progress===false) return null;
      const f=document.createDocumentFragment();
      f.appendChild(progressCard()); f.appendChild(uiTodayCard());
      const box=el(`<div class="hud-wrap"></div>`); box.appendChild(f); return box;
    },
    tasks: ()=>{
      if(W.tasks===false) return null;
      const todayTasks=S.tasks.filter(t=>!t.done && (t.dueDate===todayStr()||!t.dueDate)).slice(0,5);
      const tc=el(`<section>${sectionHead(uiT('todays_tasks'),uiT('see_all'),'tasks')}<div class="list" id="hTasks"></div></section>`);
      const tl=tc.querySelector('#hTasks');
      const plan=uiTodaysPlanCard(); if(plan) tl.appendChild(plan); // Phase 10
      if(!todayTasks.length){ const e=el(`<div class="card">${uiEmpty('🌤️',uiT('empty_tasks_t'),uiT('empty_tasks_d'),uiT('add_task'))}</div>`); e.querySelector('.emptyCta').onclick=()=>openForm('task'); tl.appendChild(e); }
      todayTasks.forEach(t=>tl.appendChild(taskItem(t)));
      return tc;
    },
    habits: ()=>{
      if(W.habits===false) return null;
      const habitsToday=S.habits.filter(h=>h.active!==false).slice(0,5);
      const hc=el(`<section>${sectionHead(uiT('todays_habits'),`${habitsToday.filter(h=>isDayComplete(h,todayStr())).length}/${habitsToday.length} ›`.replace(' ›',''),'habits')}<div class="list" id="hHabits"></div></section>`);
      const hl=hc.querySelector('#hHabits');
      if(!habitsToday.length){ const e=el(`<div class="card">${uiEmpty('🔥',uiT('empty_habits_t'),uiT('empty_habits_d'),uiT('add_habit'))}</div>`); e.querySelector('.emptyCta').onclick=()=>openHabitForm(); hl.appendChild(e); }
      habitsToday.forEach(h=>hl.appendChild(habitItem(h)));
      return hc;
    },
    goals: ()=>{
      if(W.goals===false) return null;
      const activeGoals=S.goals.filter(g=>g.status==='Active').slice(0,3);
      if(!activeGoals.length) return null;
      const gc=el(`<section>${sectionHead(uiT('active_goals'),uiT('see_all'),'goals')}<div class="card" id="hGoals"></div></section>`);
      const gl=gc.querySelector('#hGoals');
      activeGoals.forEach(g=>gl.appendChild(goalMini(g)));
      return gc;
    },
    // --- Nutrition snapshot: real today's totals vs real targets; empty state if nothing logged
    // today; never a fabricated number. ---
    nutrition: ()=>{
      if(W.nutrition===false) return null;
      const today=todayStr();
      const hasData=S.meals.some(m=>m.date===today)||S.waterLog.some(w=>w.date===today);
      const nc=el(`<div class="card snap${hasData?'':' is-empty'}" data-nav="nutrition" role="button" tabindex="0"><div class="snap-k">🍎 ${uiT('nutrition')}</div></div>`);
      if(!hasData){
        nc.appendChild(el(`<div class="snap-v">${uiT('nothing_logged')}</div>`));
      } else {
        const tot=nutriTotals(today), tg=S.nutritionTargets, water=waterToday(S);
        nc.appendChild(el(`<div class="snap-v">${uiNum(Math.round(tot.calories))} <small>/ ${uiNum(tg.calories)} ${uiT('kcal')}</small></div>`));
        nc.appendChild(el(`<div class="bar${tot.calories>tg.calories?' is-warn':''}"><i style="width:${uiPct(tot.calories,tg.calories)}%"></i></div>`));
        nc.appendChild(el(`<div class="snap-s">P ${Math.round(tot.protein)}/${tg.protein} g · 💧 ${uiNum(water)}/${uiNum(tg.water)} ml</div>`));
      }
      return nc;
    },
    // --- Finance snapshot: real month-to-date balance from S.expenses/S.income only.
    // Subscriptions are a separate collection and are never summed into this to avoid
    // double-counting (same rule as the Finance module itself). ---
    finance: ()=>{
      if(W.finance===false) return null;
      const ft=financeMonthTotals(finYm()); // Phase 11B: the same helper as the Finance dashboard
      const fc=el(`<div class="card snap${S.expenses.length||S.income.length?'':' is-empty'}" data-nav="finance" role="button" tabindex="0"><div class="snap-k">💰 ${uiT('finance')}</div></div>`);
      if(!S.expenses.length && !S.income.length){
        fc.appendChild(el(`<div class="snap-v">${uiT('nothing_logged')}</div>`));
      } else {
        const totExp=ft.expenses, totInc=ft.income, bal=ft.net;
        fc.appendChild(el(`<div class="snap-v" data-fin-net="${bal}" style="color:${bal>=0?'var(--accent2)':'var(--danger)'}">${bal>=0?'':'−'}${uiNum(Math.abs(Math.round(bal)))}</div>`));
        fc.appendChild(el(`<div class="snap-s">${uiT('balance')} · ${uiT('this_month')}<br>↑ ${uiNum(Math.round(totInc))} · ↓ ${uiNum(Math.round(totExp))}</div>`));
      }
      fc.onclick=()=>{ finView='dashboard'; finMonth=null; view='finance'; render(); };
      fc.style.cursor='pointer';
      return fc;
    },
    // --- Fitness snapshot: real workout history only; nothing shown/fabricated without data. ---
    fitness: ()=>{
      if(W.fitness===false) return null;
      const done=completedWorkouts(S);
      const todayWorkout=done.find(w=>w.date===todayStr());
      const sorted=[...done].sort((a,b)=>workoutChronoCmp(b,a));
      const last=sorted[0];
      const fitc=el(`<div class="card snap${done.length?'':' is-empty'}" data-nav="fitness" role="button" tabindex="0"><div class="snap-k">🏋️ ${uiT('fitness')}</div></div>`);
      if(!done.length){
        fitc.appendChild(el(`<div class="snap-v">${uiT('nothing_logged')}</div>`));
      } else {
        if(todayWorkout) fitc.appendChild(el(`<div class="snap-v">${uiNum(workoutVolume(todayWorkout))} <small>kg</small></div><div class="snap-s">${escapeHtml(todayWorkout.name)}</div>`));
        else fitc.appendChild(el(`<div class="snap-v" style="font-size:15px">${uiT('no_workout_today')}</div>`));
        if(last) fitc.appendChild(el(`<div class="snap-s">${uiT('last')}: ${escapeHtml(last.name)} · ${fmtDate(last.date)}</div>`));
      }
      const act=activeWorkout();
      if(act) fitc.appendChild(el(`<div class="snap-s wk-snap-live"><span class="live-dot" aria-hidden="true"></span>${uiWkT('active_t')}: ${escapeHtml(act.name)}</div>`));
      fitc.onclick=()=>{view='fitness';render();};
      fitc.style.cursor='pointer';
      return fitc;
    },
    // --- Health snapshot (Phase 7): real sleep/steps/weight/active-calories data only. ---
    health: ()=>{
      if(W.health===false) return null;
      const hasAny=S.sleepLog.length||S.weightLog.length||S.stepsLog.length||S.activeCaloriesLog.length;
      const hc=el(`<div class="card snap${hasAny?'':' is-empty'}" data-nav="health" role="button" tabindex="0"><div class="snap-k">❤️ ${uiT('health')}</div></div>`);
      if(!hasAny){
        hc.appendChild(el(`<div class="snap-v">${uiT('nothing_logged')}</div>`));
      } else {
        const today=todayStr();
        const sleepToday=S.sleepLog.find(s=>s.date===today);
        const stepsToday=S.stepsLog.find(s=>s.date===today);
        const latestWeight=[...S.weightLog].sort((a,b)=>b.date.localeCompare(a.date))[0];
        const activeCalToday=S.activeCaloriesLog.find(a=>a.date===today);
        if(sleepToday) hc.appendChild(el(`<div class="snap-v">${sleepDuration(sleepToday)} <small>h 😴</small></div>`));
        const bits=[];
        if(stepsToday) bits.push(`👟 ${uiNum(stepsToday.steps)}`);
        if(latestWeight) bits.push(`⚖️ ${latestWeight.weight} ${latestWeight.unit||'kg'}`);
        if(activeCalToday) bits.push(`🔥 ${uiNum(activeCalToday.calories)} ${uiT('kcal')}`);
        if(bits.length) hc.appendChild(el(`<div class="snap-s">${bits.join(' · ')}</div>`));
        if(!sleepToday&&!stepsToday&&!activeCalToday&&!latestWeight) hc.appendChild(el(`<div class="snap-s">${uiT('nothing_logged')}</div>`));
      }
      hc.onclick=()=>{view='health';render();};
      hc.style.cursor='pointer';
      return hc;
    },
  };
  const SNAP={nutrition:1,finance:1,fitness:1,health:1}, PAIR={tasks:1,habits:1};
  let group=null, groupKind=null;
  const place=(k,node)=>{
    const kind=SNAP[k]?'snap':PAIR[k]?'pair':null;
    if(!kind){ group=null; groupKind=null; wrap.appendChild(node); return; }
    if(groupKind!==kind){ group=el(`<div class="${kind==='snap'?'snap-grid':'home-pair'}"></div>`); groupKind=kind; wrap.appendChild(group); }
    group.appendChild(node);
  };

  const order=(S.settings.widgetOrder&&S.settings.widgetOrder.length)?S.settings.widgetOrder:WIDGET_DEFS.map(w=>w.key);
  const seen=new Set();
  order.forEach(k=>{
    if(seen.has(k)) return; seen.add(k);
    const build=builders[k];
    if(!build) return; // unknown/future widget key -- never breaks the dashboard
    const node=build();
    if(node) place(k,node);
  });
  // Any widget not present in a legacy/partial order still renders (never silently dropped).
  Object.keys(builders).forEach(k=>{
    if(seen.has(k)) return;
    const node=builders[k]();
    if(node) place(k,node);
  });
  if(wrap.querySelector('.snap-grid')) wrap.querySelectorAll('.snap-grid').forEach(g=>{ if(g.children.length===1) g.classList.add('is-single'); });
  wrap.querySelectorAll('[data-nav]').forEach(n=>{
    if(!n.onclick) n.onclick=()=>{view=n.dataset.nav;render();window.scrollTo(0,0);};
    if(n.getAttribute('role')==='button') n.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); n.onclick(); } };
  });
  return wrap;
}

function taskItem(t){
  const catInfo=CATS[t.category]||{ic:'📌'};
  // Resolved by ID — a deleted goal simply yields null and the chip is omitted (no crash).
  const linkedGoal=t.goalId?S.goals.find(g=>g.id===t.goalId):null;
  const shownXp=t.xpReward!=null?t.xpReward:(t.priority==='High'||t.priority==='Urgent'?30:10); // display of the same rule the check handler uses
  const overdue=!t.done&&t.dueDate&&t.dueDate<todayStr();
  const planned=uiTaskNextBlock(t); // Phase 10: earliest planner block for this task from today on
  const meta=[
    t.priority?`<span class="chip ${t.priority==='Urgent'?'is-danger':t.priority==='High'?'is-warn':'is-muted'}">${uiPrioLabel(t.priority)}</span>`:'',
    t.dueDate?`<span class="${overdue?'chip is-danger':''}">📅 ${uiDueLabel(t.dueDate)}</span>`:'',
    t.category?`<span>${escapeHtml(t.category)}</span>`:'',
    linkedGoal?`<button class="chip linkGoal">🎯 ${escapeHtml(linkedGoal.title)}</button>`:'',
    planned?`<button class="chip planLink" aria-label="${uiPlT('scheduled')}: ${fmtDate(planned.date)} ${planned.startTime}">🗓️ ${planned.date===todayStr()?'':fmtDate(planned.date)+' '}${planned.startTime}</button>`:'',
    t.done?'':`<span class="xp-tag">+${shownXp} XP</span>`,
  ].filter(Boolean).join(' ');
  const it=el(`<div class="item task-item" data-prio="${t.done?'':escapeHtml(t.priority||'')}">
    <button class="check ${t.done?'done':''}" aria-label="${uiT(t.done?'reopen_task':'complete_task')}: ${escapeHtml(t.title)}" aria-pressed="${t.done?'true':'false'}">${t.done?'✓':''}</button>
    <div style="flex:1;min-width:0">
      <div class="item-title ${t.done?'done':''}">${catInfo.ic} ${escapeHtml(t.title)}</div>
      ${meta?`<div class="item-meta meta-row">${meta}</div>`:''}
    </div>
    <div class="item-actions">
      <button class="iconbtn ghost-ic editBtn" aria-label="${uiT('edit')}: ${escapeHtml(t.title)}">${uiIcon('edit',18)}</button>
      <button class="delbtn" aria-label="${uiT('delete')}: ${escapeHtml(t.title)}">✕</button>
    </div>
  </div>`);
  it.querySelector('.check').onclick=()=>{
    t.done=!t.done;
    if(t.done){
      const xp=t.xpReward!=null?t.xpReward:(t.priority==='High'||t.priority==='Urgent'?30:10);
      const attrKey=(CATS[t.category]||{}).a;
      const taskKey=`task:${t.id}:${todayStr()}`;
      const granted=grantXp(xp,'Task: '+t.title,attrKey,taskKey);
      if(granted) applyCategoryAttrSkillBonus(attrKey,taskKey); // Phase 5 skill effect, same idempotent key
    }
    scheduleSave();
    // Phase 8B: a just-completed task stays on screen in its completed state for a moment
    // (lists like "Today" filter done tasks out) instead of vanishing under the finger.
    if(t.done && animationsOn()){ uiShowTaskDone(it); setTimeout(render,650); }
    else render();
  };
  it.querySelector('.editBtn').onclick=()=>openTaskEditForm(t);
  const lg=it.querySelector('.linkGoal'); if(lg) lg.onclick=(ev)=>{ev.stopPropagation();searchNavigate('goal',linkedGoal);};
  const pl=it.querySelector('.planLink'); if(pl) pl.onclick=(ev)=>{ ev.stopPropagation(); uiOpenPlanner(planned.date); };
  it.querySelector('.delbtn').onclick=()=>{S.tasks=S.tasks.filter(x=>x.id!==t.id);scheduleSave();render();};
  return it;
}
function uiShowTaskDone(it){

function openTaskEditForm(t){
  // Edits the SAME task object/id in place. Never re-grants XP itself (only the check
  // handler does, guarded by its idempotent key) and never touches t.done or completion
  // history, so a completed task's history/XP stays intact regardless of what is edited.
  const inner=el(`<div><h3>Edit Task</h3>
    <label>Title</label><input id="f_title" value="${escapeHtml(t.title)}">
    <label>Description</label><textarea id="f_desc" rows="2">${escapeHtml(t.description||'')}</textarea>
    <label>Category</label><select id="f_cat"><option value="">None</option>${catOptions()}</select>
    <label>Priority</label><select id="f_pri"><option>Low</option><option>Medium</option><option>High</option><option>Urgent</option></select>
    <label>Due date</label><input type="date" id="f_due" value="${t.dueDate||''}">
    <label>Goal</label><select id="f_goal">${goalOptions(t.goalId)}</select>
    <label>XP reward</label><input type="number" id="f_xp" min="0" value="${t.xpReward!=null?t.xpReward:(t.priority==='High'||t.priority==='Urgent'?30:10)}">
    <button class="btn" id="f_save">Save Changes</button>
    ${uiTaskPlanBlock(t)}
  </div>`);
  inner.querySelector('#f_cat').value=t.category||'';
  inner.querySelector('#f_pri').value=t.priority||'Medium';
  inner.querySelector('#f_save').onclick=()=>{
    const title=inner.querySelector('#f_title').value.trim();
    if(!title){toast('Title required');return;}
    t.title=title; t.description=inner.querySelector('#f_desc').value; t.category=inner.querySelector('#f_cat').value; t.priority=inner.querySelector('#f_pri').value;
    t.dueDate=inner.querySelector('#f_due').value; t.goalId=inner.querySelector('#f_goal').value;
    t.xpReward=parseFloat(inner.querySelector('#f_xp').value)||0;
    scheduleSave();closeSheets();render();toast('Task updated');
  };
  // Phase 10: schedule this task in the planner (creates a linked block; the task is not changed).
  inner.querySelector('#f_plan').onclick=()=>{ closeSheets(); openPlannerForm(null,{taskId:t.id,title:t.title,category:t.category,date:t.dueDate&&t.dueDate>=todayStr()?t.dueDate:todayStr()}); };
  inner.querySelectorAll('[data-plan-day]').forEach(b=>b.onclick=()=>{ closeSheets(); uiOpenPlanner(b.dataset.planDay); });
  openSheet(inner);
}

/* ---- Habit completion actions (Phase 2) — the ONLY places that mutate h.completions /
   h.brokenDates or call grantXp for a habit, so every UI entry point (Home widget, Habits
   list, Habit detail) shares the exact same idempotent logic instead of re-implementing it
   (that divergence was the root cause of the Phase 1 XP-duplication bug). */
function toggleHabitDay(h){
  // good habit, target<=1 (boolean per-day completion)
  h.completions=h.completions||[];
  const date=todayStr();
  const idx=h.completions.indexOf(date);
  if(idx>=0){ h.completions.splice(idx,1); } // uncheck: never deducts XP already granted
  else {
    h.completions.push(date);
    const attrKey=(CATS[h.category]||{a:h.attrReward||'DEX'}).a;
    const key=`habit:${h.id}:${date}`;
    const granted=grantXp(h.xpReward||15,'Habit: '+h.name,attrKey,key);
    if(granted){ applyCategoryAttrSkillBonus(attrKey,key); applyHabitStreakSkillBonus(h); }
  }
  scheduleSave();render();
}
function incrementHabitToday(h){
  // good habit, target>1 (counter-style, e.g. "Drink water" 8x/day)
  h.completions=h.completions||[];
  const date=todayStr();
  const count=h.completions.filter(d=>d===date).length;
  if(count>=(h.target||1)) return; // already at target — extra taps are no-ops, not extra XP
  h.completions.push(date);
  if(count+1>=(h.target||1)){
    const attrKey=(CATS[h.category]||{a:h.attrReward||'DEX'}).a;
    const key=`habit:${h.id}:${date}`;
    const granted=grantXp(h.xpReward||15,'Habit: '+h.name,attrKey,key);
    if(granted){ applyCategoryAttrSkillBonus(attrKey,key); applyHabitStreakSkillBonus(h); }
  }
  scheduleSave();render();
}
function decrementHabitToday(h){
  h.completions=h.completions||[];
  const date=todayStr();
  const idx=h.completions.lastIndexOf(date);
  if(idx>=0) h.completions.splice(idx,1); // never removes already-granted XP from the ledger
  scheduleSave();render();
}
function markHabitClean(h,dateStr){
  // bad habit: log "maintained" for a day. Idempotent XP via the same per-day key style.
  h.completions=h.completions||[]; h.brokenDates=h.brokenDates||[];
  const bi=h.brokenDates.indexOf(dateStr); if(bi>=0) h.brokenDates.splice(bi,1);
  if(!h.completions.includes(dateStr)){
    h.completions.push(dateStr);
    const attrKey=(CATS[h.category]||{a:h.attrReward||'DEX'}).a;
    const key=`habit:${h.id}:${dateStr}`;
    const granted=grantXp(h.xpReward||15,'Habit: '+h.name,attrKey,key);
    if(granted) applyCategoryAttrSkillBonus(attrKey,key);
  }
  scheduleSave();render();
}
function markHabitBroken(h,dateStr){
  // bad habit: log "broke it". Never calls grantXp, and never un-grants a day's XP that was
  // already logged as clean in the past — it only affects this day's own log going forward.
  h.completions=h.completions||[]; h.brokenDates=h.brokenDates||[];
  const ci=h.completions.indexOf(dateStr); if(ci>=0) h.completions.splice(ci,1);
  if(!h.brokenDates.includes(dateStr)) h.brokenDates.push(dateStr);
  scheduleSave();render();
}
function habitItem(h){
  const done=isDayComplete(h,todayStr());
  // Resolved by ID — a deleted goal simply yields null and the chip is omitted (no crash).
  const linkedGoal=h.goalId?S.goals.find(g=>g.id===h.goalId):null;
  const counter=h.type!=='bad'&&habitUsesDayCounter(h);
  const it=el(`<div class="item habit-item${h.type==='bad'?' is-bad':''}">

function goalMini(g){
  // Uses the one real goalProgress() function — no second/parallel progress calculation.
  const pct=goalProgress(g);
  const nextMs=S.milestones.filter(m=>m.goalId===g.id && !m.completed).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))[0];
  const metaBits=[g.targetDate?uiT('by')+' '+fmtDate(g.targetDate):'',nextMs?uiT('next')+': '+escapeHtml(nextMs.title):''].filter(Boolean).join(' · ');
  const it=el(`<div class="goalMiniTap goal-mini" role="button" tabindex="0" style="cursor:pointer">
    <div class="between"><span class="item-title truncate">🎯 ${escapeHtml(g.title)}</span><span class="goal-pct" style="font-size:18px">${pct}<small>%</small></span></div>
    <div class="bar" style="margin-top:8px;height:8px" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${escapeHtml(g.title)}"><i style="width:${pct}%"></i></div>
    ${metaBits?`<div class="item-meta" style="margin-top:6px">${metaBits}</div>`:''}
  </div>`);
  it.onclick=()=>{currentGoalId=g.id;view='goalDetail';render();};
  it.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); it.onclick(); } };
  return it;
}
function habitProgressPct(h){
  // Rough completion rate over the last 30 days (or since startDate if younger), used only as
  // this habit's contribution to a linked goal's auto progress — real data, not a guess.
  const start=h.startDate&&h.startDate>addDays(todayStr(),-29)?h.startDate:addDays(todayStr(),-29);
  let total=0,done=0,d=start,guard=0;
  while(d<=todayStr()&&guard<40){
    if(h.type==='bad'){ total++; if(!(h.brokenDates||[]).includes(d)) done++; }
    else if(isScheduledDate(h,d)){ total++; if(isDayComplete(h,d)) done++; }
    d=addDays(d,1); guard++;
  }
  return total?Math.round(done/total*100):0;
}
function goalProgress(g){
  if(g.status==='Completed')return 100;
  if(g.mode==='manual') return Math.max(0,Math.min(100,Math.round(g.manualProgress||0)));
  // auto mode: linked tasks > milestones > linked habits > last manual value set
  const linkedTasks=S.tasks.filter(t=>t.goalId===g.id);
  if(linkedTasks.length) return Math.round(linkedTasks.filter(t=>t.done).length/linkedTasks.length*100);
  const linkedMilestones=S.milestones.filter(m=>m.goalId===g.id);
  if(linkedMilestones.length) return Math.round(linkedMilestones.filter(m=>m.completed).length/linkedMilestones.length*100);
  const linkedHabits=S.habits.filter(h=>h.goalId===g.id);
  if(linkedHabits.length) return Math.round(linkedHabits.reduce((a,h)=>a+habitProgressPct(h),0)/linkedHabits.length);
  return Math.max(0,Math.min(100,Math.round(g.manualProgress||0)));
}
function completeGoal(g){
  // Idempotent: a goal's completion XP is granted at most once ever (not per-day, since
  // goal completion is not a recurring daily event like a task/habit).
  g.status='Completed';
  grantXp(g.xpReward||200,'Goal: '+g.title,'WIS',`goal:${g.id}:complete`);
  scheduleSave();
}
function toggleMilestone(m){
  m.completed=!m.completed;
  if(m.completed){
    m.completedAt=Date.now();
    grantXp(m.xpReward||25,'Milestone: '+m.title,'WIS',`milestone:${m.id}`);
    checkAchievements();
  } else {
    m.completedAt=null; // unchecking never removes already-granted XP
  }
  scheduleSave();
}

      <div class="goal-actions">
        ${g.status!=='Completed'?`<button class="pill sm sm-done">✓ ${uiT('mark_complete')}</button>`:''}
        <button class="delbtn" aria-label="${uiT('delete')}: ${escapeHtml(g.title)}">✕</button>
      </div>
    </div>`);
    card.querySelectorAll('.gTap').forEach(elx=>elx.onclick=()=>{currentGoalId=g.id;view='goalDetail';render();window.scrollTo(0,0);});
    card.querySelectorAll('.gTap[role="button"]').forEach(x=>x.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); x.onclick(); } });
    const mc=card.querySelector('.sm-done');
    if(mc) mc.onclick=(e)=>{e.stopPropagation();completeGoal(g);render();};
    card.querySelector('.delbtn').onclick=(e)=>{
      e.stopPropagation();
      // cascade: unlink tasks and remove milestones that belonged only to this goal
      S.tasks.forEach(t=>{ if(t.goalId===g.id) t.goalId=''; });
      S.milestones=S.milestones.filter(m=>m.goalId!==g.id);
      S.goals=S.goals.filter(x=>x.id!==g.id);
      scheduleSave();render();
    };
    list.appendChild(card);
  });
  return wrap;
}
function openGoalForm(existing){
  const g=existing;
  const inner=el(`<div><h3>${g?'Edit Goal':'New Goal'}</h3>
    <label>Title</label><input id="g_title" value="${g?escapeHtml(g.title):''}" placeholder="e.g. Run a 10K">
    <label>Description</label><textarea id="g_desc" rows="2">${g?escapeHtml(g.description||''):''}</textarea>
    <label>Category</label><select id="g_cat"><option value="">None</option>${catOptions()}</select>
    <label>Target date</label><input type="date" id="g_due" value="${g?(g.targetDate||''):''}">
    <label>Status</label><select id="g_status"><option>Active</option><option>Paused</option><option>Archived</option><option>Completed</option></select>
    <label>Progress mode</label><select id="g_mode"><option value="auto">Automatic (from linked tasks/milestones)</option><option value="manual">Manual</option></select>
    <div id="manualWrap"><label>Manual progress (%)</label><input type="number" id="g_manual" min="0" max="100" value="${g?(g.manualProgress||0):0}"></div>
    <label>XP reward on completion</label><input type="number" id="g_xp" min="0" value="${g?(g.xpReward||200):200}">
    <button class="btn" id="g_save">${g?'Save Changes':'Add Goal'}</button>
  </div>`);
  if(g){ inner.querySelector('#g_cat').value=g.category||''; inner.querySelector('#g_status').value=g.status||'Active'; inner.querySelector('#g_mode').value=g.mode||'auto'; }
  inner.querySelector('#g_save').onclick=()=>{
    const title=inner.querySelector('#g_title').value.trim();
    if(!title){toast('Title required');return;}
    const newStatus=inner.querySelector('#g_status').value;
    const wasCompleted = g && g.status==='Completed';
    if(g){
      g.title=title; g.description=inner.querySelector('#g_desc').value; g.category=inner.querySelector('#g_cat').value;
      g.targetDate=inner.querySelector('#g_due').value; g.mode=inner.querySelector('#g_mode').value;
      g.manualProgress=parseFloat(inner.querySelector('#g_manual').value)||0;
      g.xpReward=parseFloat(inner.querySelector('#g_xp').value)||0;
      if(newStatus==='Completed' && !wasCompleted){ completeGoal(g); } else { g.status=newStatus; }
    } else {
      const ng={id:uid(),title,description:inner.querySelector('#g_desc').value,category:inner.querySelector('#g_cat').value,
        targetDate:inner.querySelector('#g_due').value,status:'Active',mode:inner.querySelector('#g_mode').value,
        manualProgress:parseFloat(inner.querySelector('#g_manual').value)||0,xpReward:parseFloat(inner.querySelector('#g_xp').value)||200,
        createdAt:Date.now()};
      if(newStatus==='Completed'){ completeGoal(ng); } else { ng.status=newStatus; }
      S.goals.push(ng);
    }
    scheduleSave();closeSheets();view='goals';render();toast(g?'Goal updated':'Goal added');
  };
  const modeSel=inner.querySelector('#g_mode'), manualWrap=inner.querySelector('#manualWrap');
  function syncManualVisibility(){ manualWrap.style.display = modeSel.value==='manual' ? '' : (g&&!S.tasks.some(t=>t.goalId===g.id)&&!S.milestones.some(m=>m.goalId===g.id) ? '' : 'none'); }
  modeSel.onchange=syncManualVisibility; syncManualVisibility();
  openSheet(inner);
}

  const milestones=S.milestones.filter(m=>m.goalId===g.id);
  const linkedHabits=S.habits.filter(h=>h.goalId===g.id);
  const progressSource=linkedTasks.length?'linked tasks':milestones.length?'milestones':linkedHabits.length?'linked habits':'manual fallback';
  const srcLabel=uiT(linkedTasks.length?'src_tasks':milestones.length?'src_ms':linkedHabits.length?'src_habits':'src_manual');
  const wrap=el(`<div>
    ${uiBack(uiT('goals'))}
    <section class="card hud goal-card">
      <div class="goal-top"><div style="flex:1;min-width:0"><div class="kicker">🎯 ${uiT('goals')}</div><h2 style="margin:4px 0 0">${escapeHtml(g.title)}</h2>
        ${g.description?`<p class="sub" style="margin-top:6px">${escapeHtml(g.description)}</p>`:''}</div>
        <div class="goal-pct" style="font-size:40px">${pct}<small>%</small></div></div>
      <div class="bar${pct>=100?' is-success':''}" style="height:12px;margin:14px 0 10px" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${escapeHtml(g.title)}"><i style="width:${pct}%"></i></div>
      <div class="goal-meta"><span class="chip ${g.status==='Completed'?'is-success':''}">${uiT('g_'+g.status)}</span>${g.targetDate?`<span class="chip is-muted">⏳ ${uiT('by')} ${fmtDate(g.targetDate)}</span>`:''}<span class="chip is-gold">+${g.xpReward||200} XP</span></div>
      <div class="sub" style="margin-top:8px" data-source="${progressSource}">${g.mode==='manual'?uiT('progress_manual'):uiT('progress_auto',{s:srcLabel})}</div>

        <button class="btn ghost sm" id="editGoalBtn">${uiIcon('edit',16)} ${uiT('edit')}</button>
        ${g.status!=='Completed'?`<button class="btn sm doneBtn">✓ ${uiT('mark_complete')}</button>`:''}
      </div>
    </section>
    <div class="section-header"><h3>🚩 ${uiT('milestones')} · ${milestones.filter(m=>m.completed).length}/${milestones.length}</h3><button class="action" id="addMs">＋ ${uiT('add_milestone')}</button></div>
    <div class="tree"><div class="list" id="msList"></div></div>
    <div class="section-header"><h3>✅ ${uiT('linked_tasks')} · ${linkedTasks.length}</h3></div>
    <div class="tree"><div class="list" id="ltList"></div></div>
    ${linkedHabits.length?`<div class="section-header"><h3>🔥 ${uiT('linked_habits')} · ${linkedHabits.length}</h3></div><div class="tree"><div class="list" id="lhList"></div></div>`:''}
  </div>`);
  wrap.querySelector('#backBtn').onclick=()=>{view='goals';render();};
  wrap.querySelector('#editGoalBtn').onclick=()=>openGoalForm(g);
  const db=wrap.querySelector('.doneBtn'); if(db) db.onclick=()=>{completeGoal(g);render();};
  const lt=wrap.querySelector('#ltList');
  if(!linkedTasks.length) lt.appendChild(el(`<div class="card">${uiEmpty('✅',uiT('linked_tasks'),uiT('no_linked_tasks'),'')}</div>`));
  linkedTasks.forEach(t=>lt.appendChild(taskItem(t)));
  const lh=wrap.querySelector('#lhList');
  if(lh) linkedHabits.forEach(h=>lh.appendChild(habitItem(h)));
  const msList=wrap.querySelector('#msList');
  if(!milestones.length) msList.appendChild(el(`<div class="card">${uiEmpty('🚩',uiT('no_milestones'),'','')}</div>`));
  milestones.forEach(m=>{
    const it=el(`<div class="item">
      <button class="check ${m.completed?'done':''}" aria-label="${escapeHtml(m.title)}" aria-pressed="${m.completed?'true':'false'}">${m.completed?'✓':''}</button>
      <div style="flex:1;min-width:0"><div class="item-title ${m.completed?'done':''}">${escapeHtml(m.title)}</div>
      <div class="item-meta meta-row">${m.description?`<span>${escapeHtml(m.description)}</span>`:''}<span class="xp-tag">+${m.xpReward||25} XP</span></div></div>
      <div class="item-actions"><button class="iconbtn ghost-ic editMs" aria-label="${uiT('edit')}: ${escapeHtml(m.title)}">${uiIcon('edit',18)}</button>
      <button class="delbtn" aria-label="${uiT('delete')}: ${escapeHtml(m.title)}">✕</button></div>

    it.querySelector('.check').onclick=()=>{toggleMilestone(m);render();};

    it.querySelector('.delbtn').onclick=()=>{S.milestones=S.milestones.filter(x=>x.id!==m.id);scheduleSave();render();};

function openMilestoneForm(goalId,existing){
