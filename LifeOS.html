  uiLocalizeTree(sheet);
  const h=sheet.querySelector('h2,h3'); if(h){ if(!h.id) h.id='uiSheetTitle'+Math.random().toString(36).slice(2,7); sheet.setAttribute('aria-labelledby',h.id); }
  bg.onkeydown=(e)=>{ if(e.key==='Escape'&&bg.onclick) bg.remove(); };
  document.body.appendChild(bg);
  const first=sheet.querySelector('input:not([type=hidden]):not(.hide),select,textarea,button');
  // Never steal focus from a field the user already moved to (the timer can fire late on slow devices).
  setTimeout(()=>{ try{ if(sheet.contains(document.activeElement)) return; (first&&first.tagName!=='BUTTON'&&window.matchMedia('(pointer:fine)').matches?first:sheet).focus({preventScroll:true}); }catch(e){} },30);
  sheet.tabIndex=-1;
  return bg;
}
function catOptions(){return CAT_LIST.map(c=>`<option value="${c}">${CATS[c].ic} ${c}</option>`).join('');}

function openQuickAdd(){
  const opts=[['task','✅'],['habit','🔥'],['goal','🎯'],['expense','💸'],['income','💵'],['workout','🏋️'],['meal','🍽️'],['note','📝'],['journal','📔'],['event','📅'],['water','💧'],['fuel','⛽'],['planner','🗓️']];
  const content=el(`<div>
    <h3>${uiT('quick_add')}</h3>
    <div class="qgrid">${opts.map(([t,ic])=>`<button class="qopt" data-t="${t}"><span class="ic" aria-hidden="true">${ic}</span>${uiT('qa_'+t)}</button>`).join('')}</div>
  </div>`);
  const sheet=openSheet(content);
  content.querySelectorAll('.qopt').forEach(o=>o.onclick=()=>{
    sheet.remove();
    const t=o.dataset.t;
    if(t==='expense'||t==='income') openFinanceForm(t);
    else if(t==='workout') openWorkoutForm();
    else if(t==='meal') openMealForm();
    else if(t==='note') openNoteForm();
    else if(t==='journal') openJournalForm();
    else if(t==='event') openEventForm();
    else if(t==='goal') openGoalForm();
    else if(t==='habit') openHabitForm();
    else if(t==='water') quickAddWater();
    else if(t==='fuel') openFuelQuickAdd();
    else if(t==='planner') openPlannerForm(null,{date:todayStr()});
    else openForm(t);
  });
}
function openForm(type){
  let inner;
  if(type==='task'){
    inner=el(`<div><h3>New Task</h3>
      <label>Title</label><input id="f_title" placeholder="e.g. Finish report">
      <label>Description</label><textarea id="f_desc" rows="2"></textarea>
      <label>Category</label><select id="f_cat"><option value="">None</option>${catOptions()}</select>
      <label>Priority</label><select id="f_pri"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select>
      <label>Due date</label><input type="date" id="f_due" value="${todayStr()}">
      <label>Goal</label><select id="f_goal">${goalOptions()}</select>
      <label>XP reward</label><input type="number" id="f_xp" min="0" value="10">
      <button class="btn" id="f_save">Add Task</button>
    </div>`);
    const priSel=inner.querySelector('#f_pri'), xpInput=inner.querySelector('#f_xp');
    priSel.onchange=()=>{ xpInput.value = (priSel.value==='High'||priSel.value==='Urgent')?30:10; };
    inner.querySelector('#f_save').onclick=()=>{
      const title=inner.querySelector('#f_title').value.trim();
      if(!title){toast('Title required');return;}
      S.tasks.push({id:uid(),title,description:inner.querySelector('#f_desc').value,category:inner.querySelector('#f_cat').value,priority:priSel.value,
        dueDate:inner.querySelector('#f_due').value,goalId:inner.querySelector('#f_goal').value,xpReward:parseFloat(xpInput.value)||0,done:false,createdAt:Date.now()});
      scheduleSave();closeSheets();view='tasks';render();toast('Task added');
    };
  } else if(type==='habit'){
    inner=el(`<div><h3>New Habit</h3>
      <label>Name</label><input id="f_name" placeholder="e.g. Read 20 min">
      <label>Category</label><select id="f_cat">${catOptions()}</select>
      <button class="btn" id="f_save">Add Habit</button>
    </div>`);
    inner.querySelector('#f_save').onclick=()=>{
      const name=inner.querySelector('#f_name').value.trim();
      if(!name){toast('Name required');return;}
      S.habits.push({id:uid(),name,category:inner.querySelector('#f_cat').value,icon:CATS[inner.querySelector('#f_cat').value]?.ic||'🔥',
        completions:[],active:true,createdAt:Date.now()});
      scheduleSave();closeSheets();view='habits';render();checkAchievements();toast('Habit added');
    };
  } else if(type==='goal'){
    inner=el(`<div><h3>New Goal</h3>
      <label>Title</label><input id="f_title" placeholder="e.g. Run a 10K">
      <label>Description</label><textarea id="f_desc" rows="2"></textarea>
      <label>Target date</label><input type="date" id="f_due">
      <button class="btn" id="f_save">Add Goal</button>
    </div>`);
    inner.querySelector('#f_save').onclick=()=>{
      const title=inner.querySelector('#f_title').value.trim();
      if(!title){toast('Title required');return;}
      S.goals.push({id:uid(),title,description:inner.querySelector('#f_desc').value,targetDate:inner.querySelector('#f_due').value,
        status:'Active',manualProgress:0,createdAt:Date.now()});
      scheduleSave();closeSheets();view='goals';render();toast('Goal added');
    };
  }
  openSheet(inner);
}
function closeSheets(){document.querySelectorAll('.sheet-bg').forEach(s=>s.remove());}

/* ---- Quick Add: Water & Fuel (Phase 4) — write to the exact same real collections/model
   used by the Nutrition and Car modules, never a UI-only change. ---- */
function quickAddWater(){
  // Same model/collection as the Nutrition "+250ml Water" button: a real S.waterLog entry.
  S.waterLog.push({id:uid(),date:todayStr(),amount:250});
  checkAchievements();scheduleSave();render();toast('+250ml water');
}
function openFuelQuickAdd(){
  // Fuel entries belong to a vehicle. Quick Add must create the SAME model as Car → Fuel
  // (openFuelForm), so it re-uses that exact form/collection — it never invents a parallel one.
  if(!S.vehicles.length){ toast('Add a vehicle first (Car module)'); return; }
  if(S.vehicles.length===1){ openFuelForm(S.vehicles[0].id); return; }
  const inner=el(`<div><h3>Fuel — choose vehicle</h3><div class="list" id="vSel"></div></div>`);
  const list=inner.querySelector('#vSel');
  S.vehicles.forEach(v=>{
    const it=el(`<div class="item" style="cursor:pointer"><span style="font-size:18px">🚗</span><div style="flex:1"><div class="item-title">${escapeHtml(v.name)}</div></div><span class="sub">›</span></div>`);
    it.onclick=()=>{ closeSheets(); openFuelForm(v.id); };
    list.appendChild(it);
  });
  openSheet(inner);
}

/* ---- theme ---- */
// Phase 6: 'system' is now a real third option, resolved live from the OS/browser preference
// via matchMedia; 'light'/'dark' stay explicit and never change on their own.
function computedTheme(){
  const th=S.settings.theme;
  if(th==='system'){
    try{ return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }
    catch(e){ return 'dark'; }
  }
  return th;
}
function applyTheme(){document.documentElement.setAttribute('data-theme',computedTheme());}
try{
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(S && S.settings.theme==='system') applyTheme(); });
  }
}catch(e){}
document.getElementById('themeBtn').onclick=()=>{
  // Quick toggle always switches to an explicit dark/light, based on what's on screen right
  // now -- even when the setting was 'system', so one tap always has an obvious effect.
  S.settings.theme=computedTheme()==='dark'?'light':'dark';
  applyTheme();scheduleSave();render();
};
document.getElementById('settingsBtn').onclick=()=>{ view='settings'; render(); window.scrollTo(0,0); };
document.getElementById('fabBtn').onclick=openQuickAdd;
document.querySelectorAll('nav.bottom button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();window.scrollTo(0,0);});

/* ---- PWA: manifest + service worker (self-contained, no external files) ---- */
try{
  const manifest={name:'LifeOS',short_name:'LifeOS',start_url:'./',display:'standalone',background_color:'#0b0d12',theme_color:'#0b0d12',
    icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237c5cff'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EL%3C/text%3E%3C/svg%3E",sizes:'192x192',type:'image/svg+xml'}]};
  const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
  document.getElementById('manifestLink').href=URL.createObjectURL(mBlob);
}catch(e){}
try{
  if('serviceWorker' in navigator){
    const swCode=`
      const CACHE='lifeos-v1';
      self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(CACHE).then(c=>c.add(self.registration.scope)));});
      self.addEventListener('activate',e=>self.clients.claim());
      self.addEventListener('fetch',e=>{
        e.respondWith(fetch(e.request).then(r=>{const rc=r.clone();caches.open(CACHE).then(c=>c.put(e.request,rc));return r;}).catch(()=>caches.match(e.request)));
      });
    `;
    const swBlob=new Blob([swCode],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }
}catch(e){}

/* ---- boot ---- */
(async function boot(){
  let saved=null, readError=null;
  for(let attempt=0;attempt<3;attempt++){
    try{ saved=await idbGet('state'); readError=null; break; }
    catch(e){ readError=e; await new Promise(r=>setTimeout(r,150)); }
  }
  if(saved && saved.tasks){
    S = migrate(saved);
    lastLevelSeen = levelFromXp(S.totalXp).level;
    applyTheme(); checkAchievements(); checkQuests(); render();
  } else if(readError){
    // Could not confirm whether existing data is present. Do NOT silently fall back to
    // onboarding here: that path can lead to a save that overwrites real data with .put().
    S = defaultState();
    lastLevelSeen = 1;
    applyTheme();
    document.getElementById('app').innerHTML =
      '<div class="card" style="margin-top:20px"><h3>Could not load your data</h3>'+
      '<p class="sub" style="margin:8px 0 14px">LifeOS could not read its local database on this device/browser. '+
      'To avoid overwriting anything that may already be saved, no changes will be saved until this is resolved. '+
      'Try reloading the page.</p>'+
      '<button class="btn" onclick="location.reload()">Reload</button></div>';
  } else {
    S = defaultState();
    lastLevelSeen = 1;
    applyTheme();
    showOnboarding();
  }
})();
// ---- Phase 6: real first-launch onboarding wizard (Step 1 Name -> 2 Avatar -> 3 Main goal
// -> 4 Habits -> 5 Daily targets -> 6 Finish), with Skip available on every step. Skip never
// leaves the app in a broken state -- it just finishes onboarding without applying whatever
// hasn't been filled in yet (name/avatar collected so far are kept; nothing else is invented). ----
const ONBOARDING_HABIT_PRESETS=['Drink water','Exercise','Read'];
function defaultOnboardingData(){
  return {name:'', avatar:'🧙', goalTitle:'', goalDate:'', habitPicks:[],
    targets:{calories:2200,protein:150,water:2500,workoutsPerWeek:3,tasksPerDay:3,habitsPerDay:1}};
}
function showOnboarding(step,data){
  step = step || 1;
  data = data || defaultOnboardingData();
  closeSheets();
  const stepBtns=(nextLabel,onNext,onBack)=>{
    const row=el(`<div class="ob-actions"></div>`);
    if(onBack){ const b=el(`<button class="btn ghost" data-ob="back" aria-label="${uiT('back_btn')}">‹</button>`); b.onclick=onBack; row.appendChild(b); }
    const skip=el(`<button class="btn ghost" data-ob="skip">${uiT('skip')}</button>`); skip.onclick=()=>finishOnboardingWizard(data,true); row.appendChild(skip);
    const next=el(`<button class="btn" data-ob="next" style="flex:1">${nextLabel==='Next'?uiT('next_btn'):nextLabel}</button>`); next.onclick=onNext; row.appendChild(next);
    return row;
  };
  // Phase 8B: progress header for every step (presentation only).
  const obHead=(emoji,title,lead)=>`<div class="ob-steps" aria-label="${uiT('ob_step',{n:step})}">${[1,2,3,4,5,6].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><div class="kicker" style="margin-bottom:10px">${uiT('ob_step',{n:step})}</div><div class="ob-emoji" aria-hidden="true">${emoji}</div><h2>${title}</h2><p class="ob-lead">${lead}</p>`;
  let inner;
  if(step===1){
    inner=el(`<div class="ob">${obHead('⚔️','Vítej v LifeOS','Tvůj život jako RPG. Plň úkoly a návyky, sbírej XP a vylepšuj svou postavu. Jak ti máme říkat?')}
      <label for="ob_name">Jméno</label><input id="ob_name" placeholder="např. David" autocomplete="given-name" value="${escapeHtml(data.name)}"></div>`);
    inner.appendChild(stepBtns('Next',()=>{ data.name=inner.querySelector('#ob_name').value.trim(); showOnboarding(2,data); }));
  } else if(step===2){
    inner=el(`<div class="ob">${obHead(data.avatar,'Vyber si avatara','Tvoje postava na obrazovce Domů a v profilu. Kdykoli ho změníš v Nastavení.')}
      <div class="ob-avatars" id="ob_avatars"></div></div>`);
    const av=inner.querySelector('#ob_avatars');
    AVATAR_CHOICES.forEach(a=>{
      const b=el(`<button class="iconbtn${a===data.avatar?' is-selected':''}" aria-pressed="${a===data.avatar}" aria-label="Avatar ${a}">${a}</button>`);
      b.onclick=()=>{ data.avatar=a; showOnboarding(2,data); };
      av.appendChild(b);
    });
    inner.appendChild(stepBtns('Next',()=>showOnboarding(3,data),()=>showOnboarding(1,data)));
  } else if(step===3){
    inner=el(`<div class="ob">${obHead('🎯','Hlavní cíl','Na čem chceš teď nejvíc pracovat? Cíl dá úkolům a návykům směr. (nepovinné)')}
      <label for="ob_goal">Cíl</label><input id="ob_goal" placeholder="např. Být ve formě" value="${escapeHtml(data.goalTitle)}">
      <label for="ob_goal_date">Termín (nepovinné)</label><input type="date" id="ob_goal_date" value="${data.goalDate||''}"></div>`);
    inner.appendChild(stepBtns('Next',()=>{
      data.goalTitle=inner.querySelector('#ob_goal').value.trim();
      data.goalDate=inner.querySelector('#ob_goal_date').value;
      showOnboarding(4,data);
    },()=>showOnboarding(2,data)));
  } else if(step===4){
    inner=el(`<div class="ob">${obHead('🔥','Návyky','Každý splněný návyk dává XP a buduje streak. Vyber, co chceš sledovat.')}
      <div id="ob_habits"></div></div>`);
    const hc=inner.querySelector('#ob_habits');
    ONBOARDING_HABIT_PRESETS.forEach(name=>{
      const checked=data.habitPicks.includes(name);
      const row=el(`<div class="ob-habit"><span><b>${escapeHtml(name)}</b></span><button class="pill sm ${checked?'on':''}" aria-pressed="${checked}">${checked?'✓ přidáno':'＋ přidat'}</button></div>`);
      row.querySelector('button').onclick=()=>{
        const idx=data.habitPicks.indexOf(name);
        if(idx>=0) data.habitPicks.splice(idx,1); else data.habitPicks.push(name);
        showOnboarding(4,data);
      };
      hc.appendChild(row);
    });
    inner.appendChild(stepBtns('Next',()=>showOnboarding(5,data),()=>showOnboarding(3,data)));
  } else if(step===5){
    inner=el(`<div class="ob">${obHead('📊','Denní cíle','Výchozí cíle pro výživu a aktivitu. Později je upravíš v Nastavení.')}
      <div class="grid2">
        <div><label>Kalorie</label><input type="number" id="ob_cal" value="${data.targets.calories}"></div>
        <div><label>Bílkoviny (g)</label><input type="number" id="ob_prot" value="${data.targets.protein}"></div>
        <div><label>Voda (ml)</label><input type="number" id="ob_water" value="${data.targets.water}"></div>
        <div><label>Tréninky/týden</label><input type="number" id="ob_wpw" value="${data.targets.workoutsPerWeek}"></div>
        <div><label>Úkoly/den</label><input type="number" id="ob_tpd" value="${data.targets.tasksPerDay}"></div>
        <div><label>Návyky/den</label><input type="number" id="ob_hpd" value="${data.targets.habitsPerDay}"></div>
      </div></div>`);
    inner.appendChild(stepBtns('Next',()=>{
      data.targets={
        calories:parseFloat(inner.querySelector('#ob_cal').value)||2200,
        protein:parseFloat(inner.querySelector('#ob_prot').value)||150,
        water:parseFloat(inner.querySelector('#ob_water').value)||2500,
        workoutsPerWeek:parseInt(inner.querySelector('#ob_wpw').value,10)||3,
        tasksPerDay:parseInt(inner.querySelector('#ob_tpd').value,10)||3,
        habitsPerDay:parseInt(inner.querySelector('#ob_hpd').value,10)||1,
      };
      showOnboarding(6,data);
    },()=>showOnboarding(4,data)));
  } else {
    inner=el(`<div class="ob">${obHead('🏆','Vše je připraveno!','Tvoje dobrodružství začíná na Level 1. Začni s ukázkovými daty, ať vidíš, jak LifeOS funguje, nebo s prázdným profilem.')}
      <div class="stack">
      <button class="btn" id="ob_seed">${uiT('start_sample')}</button>
      <button class="btn ghost" id="ob_finish">${uiT('finish')}</button>
      <button class="btn ghost" id="ob_back6">‹ ${uiT('back_btn')}</button></div></div>`);
    inner.querySelector('#ob_seed').onclick=()=>finishOnboardingWizard(data,false,true);
    inner.querySelector('#ob_finish').onclick=()=>finishOnboardingWizard(data,false,false);
    inner.querySelector('#ob_back6').onclick=()=>showOnboarding(5,data);
  }
  const bg=openSheet(inner);
  bg.onclick=null; // force an explicit Next/Skip/Finish -- no dismiss-by-backdrop mid-wizard
}
// skipped=true: apply only what was actually filled in (name/avatar); never invent goals,
// habits or targets the person never confirmed. Never leaves onboarded=false, so Skip can
// never re-trap the user in the wizard on next load.
function finishOnboardingWizard(data,skipped,withSeed){
  S.profile.name = data.name || 'Hero';
  S.profile.avatar = data.avatar || '🧙';
  if(!skipped){
    if(data.goalTitle) S.goals.push({id:uid(),title:data.goalTitle,description:'',targetDate:data.goalDate||'',status:'Active',manualProgress:0,createdAt:Date.now()});
    (data.habitPicks||[]).forEach(name=>{ S.habits.push(migrateHabit({id:uid(),name,createdAt:Date.now()})); });
    S.nutritionTargets.calories=data.targets.calories;
    S.nutritionTargets.protein=data.targets.protein;
    S.nutritionTargets.water=data.targets.water;
    S.dailyTargets.workoutsPerWeek=data.targets.workoutsPerWeek;
    S.dailyTargets.tasksPerDay=data.targets.tasksPerDay;
    S.dailyTargets.habitsPerDay=data.targets.habitsPerDay;
  }
  S.settings.onboarded = true;
  if(withSeed) seedData();
  closeSheets();
  checkAchievements(); checkQuests();
  scheduleSave(); render();
  toast('Welcome to LifeOS!');
}

/* ---- daily reset touch (keeps app aware of new day without losing data) ---- */
setInterval(()=>{ render(); checkBrowserNotifications(); }, 60000);
</script>
