<style>
/* ===================================================================
   FÁZE 8A — DESIGN SYSTEM + UI ARCHITECTURE
   Every existing selector below (used throughout the JS render functions)
   keeps its name and behavior unchanged. New tokens/components are
   additive. No business logic lives in this file's <style> block.
   =================================================================== */

/* ---------- 1. DESIGN TOKENS ---------- */
:root{
  /* Color -- legacy names (--bg,--card,--card2,--text,--sub,--line,--warn) are the ones
     referenced throughout the app's inline styles/JS and MUST keep exactly these names.
     New semantic aliases point at the same values so new components can read intent-named
     tokens while old markup keeps working untouched. */
  --bg:#0b0d12; --bg2:#12151c; --card:#171b24; --card2:#1e2330;
  --text:#eef1f6; --sub:#9aa3b2; --line:#262c3a;
  --accent:#7c5cff; --accent2:#00d4a0; --warn:#ffb020; --danger:#ff5c7a; --info:#5c9bff;
  --str:#ff5c5c;--int:#5c9bff;--dex:#5cffb0;--vit:#ffd15c;--wis:#c05cff;--foc:#5ce0ff;--soc:#ff8fd6;
  --r:16px;

  /* Semantic aliases (Design Direction §3) */
  --color-bg:var(--bg);
  --color-surface:var(--card);
  --color-surface-elevated:var(--card2);
  --color-surface-muted:#0e1017;
  --color-border:var(--line);
  --color-text-primary:var(--text);
  --color-text-secondary:var(--sub);
  --color-text-muted:#6b7385;
  --color-accent:var(--accent);
  --color-accent-muted:rgba(124,92,255,.16);
  --color-success:var(--accent2);
  --color-warning:var(--warn);
  --color-danger:var(--danger);
  --color-info:var(--info);

  /* Typography */
  --font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fs-h1:28px; --fs-h2:22px; --fs-h3:17px;
  --fs-body:15px; --fs-body-sm:13px; --fs-caption:12px;
  --fw-regular:400; --fw-medium:600; --fw-bold:800;
  --lh-tight:1.2; --lh-normal:1.45; --lh-loose:1.6;

  /* Spacing scale */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-7:32px; --sp-8:40px; --sp-9:48px;

  /* Radius scale */
  --radius-sm:8px; --radius-md:12px; --radius-lg:var(--r); --radius-pill:100px;

  /* Shadows */
  --shadow-subtle:0 1px 2px rgba(0,0,0,.18);
  --shadow-card:0 6px 20px rgba(0,0,0,.28);
  --shadow-elevated:0 12px 32px rgba(0,0,0,.4);

  /* Motion */
  --dur-fast:120ms; --dur-normal:220ms; --dur-slow:360ms;
  --ease-standard:cubic-bezier(.2,.7,.3,1);

  /* Layout */
  --sidebar-w:240px; --content-max:960px;
  --pad-t:env(safe-area-inset-top,0px); --pad-b:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f4f5f8; --bg2:#ffffff; --card:#ffffff; --card2:#f0f1f6;
  --text:#161821; --sub:#666e80; --line:#e3e5ec;
  --color-surface-muted:#eceef4;
  --color-text-muted:#8991a1;
  --color-accent-muted:rgba(124,92,255,.1);
  --shadow-subtle:0 1px 2px rgba(20,20,30,.06);
  --shadow-card:0 6px 20px rgba(20,20,30,.08);
  --shadow-elevated:0 16px 32px rgba(20,20,30,.14);
}
/* Respect the OS-level "system" preference for a first paint before applyTheme() runs, and
   for anyone whose data-theme attribute hasn't been set yet -- applyTheme()/computedTheme()
   remain the single source of truth once JS boots and are never overridden here. */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){
    --bg:#f4f5f8; --bg2:#ffffff; --card:#ffffff; --card2:#f0f1f6;
    --text:#161821; --sub:#666e80; --line:#e3e5ec;
    --color-surface-muted:#eceef4; --color-text-muted:#8991a1;
  }
}

*{box-sizing:border-box}
html{scroll-padding-top:var(--pad-t)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-family);
  padding-top:var(--pad-t);padding-bottom:var(--pad-b);min-height:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0 0 var(--sp-2);font-weight:var(--fw-bold);line-height:var(--lh-tight)}
p{margin:0;line-height:var(--lh-normal)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;border-radius:var(--radius-sm)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
#app{max-width:var(--content-max);margin:0 auto;padding:var(--sp-4) var(--sp-4) 100px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px calc(14px + var(--pad-t));position:sticky;top:0;background:linear-gradient(var(--bg),var(--bg) 80%,transparent);z-index:10;max-width:var(--content-max);margin:0 auto}
.brand{font-weight:800;font-size:20px;letter-spacing:-.5px}
.brand span{color:var(--accent)}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:18px;cursor:pointer;transition:background var(--dur-fast) var(--ease-standard),transform var(--dur-fast) var(--ease-standard)}
.iconbtn:active{transform:scale(.94)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-subtle)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:700px){.grid3{grid-template-columns:1fr 1fr 1fr;gap:12px}}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between}
.sub{color:var(--sub);font-size:13px}
.big{font-size:28px;font-weight:800}
.bar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width var(--dur-slow) var(--ease-standard)}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border-radius:100px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--sub)}
.pill{padding:6px 12px;border-radius:100px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:13px;cursor:pointer;white-space:nowrap;min-height:36px;display:inline-flex;align-items:center;transition:background var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card2);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;min-height:44px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;color:transparent;font-size:14px;transition:background var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard)}
.check.done{background:var(--accent2);border-color:var(--accent2);color:#06231a}
.item-title{font-weight:600;font-size:15px}
.item-title.done{text-decoration:line-through;color:var(--sub)}
.item-meta{font-size:12px;color:var(--sub);margin-top:2px}
.delbtn{background:none;border:none;color:var(--sub);font-size:18px;cursor:pointer;padding:4px 8px;min-width:44px;min-height:44px}
.empty{text-align:center;padding:40px 16px;color:var(--sub)}
.empty .e{font-size:38px;margin-bottom:8px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 4px calc(8px + var(--pad-b));z-index:20}
nav.bottom button{background:none;border:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;min-width:44px;min-height:44px;justify-content:center;cursor:pointer;border-radius:var(--radius-sm);transition:color var(--dur-fast) var(--ease-standard)}
nav.bottom button .ic{font-size:20px}
nav.bottom button.on{color:var(--accent)}
.fab{position:fixed;bottom:calc(76px + var(--pad-b));right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);
  color:#fff;font-size:28px;border:none;box-shadow:0 8px 20px rgba(124,92,255,.4);cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;transition:transform var(--dur-fast) var(--ease-standard)}
.fab:active{transform:scale(.92)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fadein var(--dur-normal) var(--ease-standard)}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;padding-bottom:calc(18px + var(--pad-b));animation:sheetup var(--dur-normal) var(--ease-standard)}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px;max-height:80vh}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheetup{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font-size:15px;margin-bottom:10px;font-family:inherit;min-height:44px;transition:border-color var(--dur-fast) var(--ease-standard)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;font-weight:600}
.btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;width:100%;cursor:pointer;min-height:44px;transition:transform var(--dur-fast) var(--ease-standard),opacity var(--dur-fast) var(--ease-standard)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px}
.qgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.qopt{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px 6px;text-align:center;cursor:pointer;color:var(--text);min-height:44px}
.qopt .ic{font-size:22px;display:block;margin-bottom:6px}
.attr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.attr .dot{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#0a0b0f;flex:none}
.toastwrap{position:fixed;top:calc(10px + var(--pad-t));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:100px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:tin var(--dur-normal) var(--ease-standard)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.hide{display:none!important}
a{color:var(--accent)}

/* ---------- 2. NEW REUSABLE COMPONENTS (additive; no existing screen requires these
   to keep working, they are available for progressive adoption on top of the tokens above) ---------- */

/* Stat Card: a labeled number, used by Statistics/Health/Character-style summaries */
.stat-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--sp-4);box-shadow:var(--shadow-subtle)}
.stat-card .stat-label{font-size:var(--fs-caption);color:var(--color-text-secondary);font-weight:var(--fw-medium);text-transform:uppercase;letter-spacing:.04em;margin-bottom:var(--sp-1)}
.stat-card .stat-value{font-size:var(--fs-h1);font-weight:var(--fw-bold);line-height:var(--lh-tight)}
.stat-card .stat-sub{font-size:var(--fs-body-sm);color:var(--color-text-muted);margin-top:var(--sp-1)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
@media(min-width:700px){.stat-grid{grid-template-columns:repeat(3,1fr)}}

/* XP Bar: same track visual language as .bar, but a dedicated class so RPG XP progress can
   carry its own gradient/height without touching the generic .bar used elsewhere */
.xp-bar{height:12px;border-radius:var(--radius-pill);background:var(--color-surface-elevated);overflow:hidden;position:relative;border:1px solid var(--color-border)}
.xp-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--color-accent),var(--color-success));border-radius:var(--radius-pill);transition:width var(--dur-slow) var(--ease-standard)}

/* Chip: compact removable/selectable tag (distinct from .pill's toggle-button role) */
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--color-accent-muted);color:var(--color-accent);border-radius:var(--radius-pill);padding:4px 10px;font-size:var(--fs-caption);font-weight:var(--fw-medium)}

/* Toggle switch */
.toggle{position:relative;display:inline-block;width:44px;height:26px;flex:none}
.toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.toggle .track{position:absolute;inset:0;background:var(--color-surface-elevated);border:1px solid var(--color-border);border-radius:var(--radius-pill);transition:background var(--dur-fast) var(--ease-standard)}
.toggle .track::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform var(--dur-fast) var(--ease-standard)}
.toggle input:checked+.track{background:var(--color-accent)}
.toggle input:checked+.track::after{transform:translateX(18px)}

/* Checkbox (square variant of .check, for multi-select contexts) */
.checkbox{width:22px;height:22px;border-radius:var(--radius-sm);border:2px solid var(--color-border);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;color:transparent;font-size:13px}
.checkbox.done{background:var(--color-accent);border-color:var(--color-accent);color:#fff}

/* Section header: label + optional trailing action, used above a list/card group */
.section-header{display:flex;align-items:baseline;justify-content:space-between;margin:var(--sp-5) 0 var(--sp-2)}
.section-header h3{font-size:var(--fs-h3);margin:0}
.section-header .action{font-size:var(--fs-body-sm);color:var(--color-accent);cursor:pointer;background:none;border:none;padding:var(--sp-1)}

/* List Row: richer alternative to .item when a leading icon/avatar + trailing meta is needed */
.list-row{display:flex;align-items:center;gap:var(--sp-3);background:var(--color-surface-elevated);border-radius:var(--radius-md);padding:var(--sp-3);min-height:44px}
.list-row .list-row-main{flex:1;min-width:0}
.list-row .list-row-title{font-weight:var(--fw-medium);font-size:var(--fs-body)}
.list-row .list-row-meta{font-size:var(--fs-caption);color:var(--color-text-secondary)}

/* Avatar */
.avatar{width:40px;height:40px;border-radius:50%;background:var(--color-surface-elevated);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;border:1px solid var(--color-border)}
.avatar.sm{width:28px;height:28px;font-size:14px}
.avatar.lg{width:64px;height:64px;font-size:30px}

/* Divider */
.divider{height:1px;background:var(--color-border);border:none;margin:var(--sp-4) 0}

/* Dropdown -- purely a styling wrapper around a native <select>, no custom JS required */
.dropdown{position:relative}
.dropdown select{appearance:none;padding-right:32px}
.dropdown::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--color-text-secondary);pointer-events:none;font-size:12px}

/* Date selector / Period selector: a segmented control, e.g. Today/Week/Month/Year */
.period-selector{display:flex;gap:6px;background:var(--color-surface-elevated);border-radius:var(--radius-pill);padding:4px;overflow-x:auto}
.period-selector button{flex:1;border:none;background:transparent;color:var(--color-text-secondary);border-radius:var(--radius-pill);padding:8px 10px;font-size:var(--fs-body-sm);font-weight:var(--fw-medium);cursor:pointer;min-height:36px;white-space:nowrap;transition:background var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard)}
.period-selector button.on{background:var(--color-accent);color:#fff}
.date-selector{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}

/* Modal: full-screen variant of .sheet for large forms on small screens (opt-in class,
   .sheet/.sheet-bg keep working exactly as before for every existing call site) */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg2);border-radius:var(--radius-lg);padding:var(--sp-5);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-elevated)}
@media(max-width:699px){
  .modal-bg{align-items:flex-end}
  .modal{border-radius:20px 20px 0 0;max-height:92vh;padding-bottom:calc(var(--sp-5) + var(--pad-b))}
}

/* Helper text / validation error, for the unified form pattern (§11) */
.helper-text{font-size:var(--fs-caption);color:var(--color-text-muted);margin:-6px 0 10px}
.field-error{font-size:var(--fs-caption);color:var(--color-danger);margin:-6px 0 10px}
input.invalid,select.invalid,textarea.invalid{border-color:var(--color-danger)}

/* ---------- 3. RESPONSIVE BREAKPOINTS (§6/§7) ----------
   320/375/390/430 = phones (fluid by default, these just fine-tune density);
   700+ = tablet (existing .grid3/.sheet rules already widen above); 900+ = desktop sidebar. */
@media(max-width:374px){
  #app{padding-left:var(--sp-3);padding-right:var(--sp-3)}
  .big{font-size:24px}
}
@media(min-width:375px) and (max-width:389px){ /* iPhone SE/8-class width: no extra rule needed, fluid layout already fits */ }
@media(min-width:390px) and (max-width:429px){ /* iPhone 12/13/14-class width: default spacing already tuned for this */ }
@media(min-width:430px){ /* iPhone Pro Max-class width and up */
  #app{padding-left:var(--sp-5);padding-right:var(--sp-5)}
}
@media(min-width:900px){
  body.has-sidebar-layout{--pad-b:0px} /* desktop: no home-indicator inset to reserve */
  nav.bottom{
    top:0;bottom:0;left:0;right:auto;width:var(--sidebar-w);height:100vh;
    flex-direction:column;justify-content:flex-start;align-items:stretch;
    padding:var(--sp-6) var(--sp-3);gap:var(--sp-1);
    border-top:none;border-right:1px solid var(--color-border);
  }
  nav.bottom button{flex-direction:row;justify-content:flex-start;gap:var(--sp-3);font-size:var(--fs-body);padding:10px var(--sp-3);width:100%;text-align:left}
  nav.bottom button .ic{font-size:18px}
  nav.bottom button.on{background:var(--color-accent-muted)}
  .topbar{margin-left:var(--sidebar-w);max-width:none;padding-left:var(--sp-6);padding-right:var(--sp-6)}
  #app{margin-left:var(--sidebar-w);max-width:820px;padding-bottom:var(--sp-8)}
}
@media(min-width:1200px){
  #app{max-width:920px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Life<span>OS</span></div>
  <div class="row" style="gap:8px">
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙️</button>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle theme">🌙</button>
  </div>
</div>
<div id="app"></div>
<div class="toastwrap" id="toasts"></div>
<button class="fab" id="fabBtn" aria-label="Quick add">+</button>
<nav class="bottom">
  <button data-v="home" class="on"><span class="ic">🏠</span>Home</button>
  <button data-v="tasks"><span class="ic">✅</span>Tasks</button>
  <button data-v="habits"><span class="ic">🔥</span>Habits</button>
  <button data-v="character"><span class="ic">🧙</span>Character</button>
  <button data-v="more"><span class="ic">☰</span>More</button>
</nav>

<script>
/* ---------- STORAGE (IndexedDB via minimal wrapper, single "state" doc) ---------- */
const DB_NAME='lifeos', STORE='kv';
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
  r.onblocked=()=>rej(new Error('IndexedDB open blocked (another tab holding an older connection)'));
});}
async function idbGet(k){
  const db=await openDB(); // let failures here propagate to the caller (boot() retries on this)
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly').objectStore(STORE).get(k);
    tx.onsuccess=()=>res(tx.result); tx.onerror=()=>rej(tx.error);
  });
}
async function idbSet(k,v){
  try{
    const db=await openDB();
    await new Promise((res,rej)=>{
      const tx=db.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);
      tx.onsuccess=()=>res(true); tx.onerror=()=>rej(tx.error);
    });
    return true;
  }catch(e){
    console.error('save fail',e);
    try{toast('⚠️ Could not save — check device storage');}catch(_){}
    return false;
  }
}

function xpForLevel(l){return Math.round(100*Math.pow(l,1.35));} // xp required to go from l to l+1
function levelFromXp(totalXp){let lvl=1,xp=totalXp;while(xp>=xpForLevel(lvl)){xp-=xpForLevel(lvl);lvl++;}return{level:lvl,into:xp,need:xpForLevel(lvl)};}

/* ---- Phase 5: RPG activity log (persistent, real events only) ---- */
function logActivity(type,title,description,xp){
  S.rpg.activityLog.unshift({id:uid(),type,title,description,xp:xp||0,createdAt:Date.now()});
  if(S.rpg.activityLog.length>200) S.rpg.activityLog.length=200; // cap growth, most-recent-first
}

/* ---- Phase 5: Level-up rewards (Skill Points + Attribute Points) ----
   Idempotent by construction: driven purely by comparing the REAL level derived from
   S.totalXp against the persisted S.rpg.highestLevelRewarded, never by session/UI state.
   Re-running this (on reload, migration, or repeated calls) when no new level has been
   reached is always a no-op, and a multi-level XP jump correctly pays out once per level. */
function applyLevelRewards(state){
  const curLevel=levelFromXp(state.totalXp).level;
  const from=state.rpg.highestLevelRewarded||1;
  if(curLevel<=from) return 0;
  const gained=curLevel-from;
  state.rpg.skillPoints.available+=gained; state.rpg.skillPoints.earned+=gained;
  state.rpg.attributePoints.available+=gained*3; state.rpg.attributePoints.earned+=gained*3;
  for(let lv=from+1;lv<=curLevel;lv++){
    state.rpg.activityLog.unshift({id:uid(),type:'levelup',title:'Level '+lv,description:'Reached Level '+lv+' — +1 Skill Point, +3 Attribute Points',xp:0,createdAt:Date.now()});
  }
  if(state.rpg.activityLog.length>200) state.rpg.activityLog.length=200;
  state.rpg.highestLevelRewarded=curLevel;
  return gained;
}

/* ---- Phase 5: Skill unlock + spend ---- */
function unlockSkill(id){
  const skill=SKILLS.find(s=>s.id===id);
  if(!skill) return false;
  if(S.rpg.skillTree.unlocked.includes(id)) return false; // already unlocked -- clicking again does nothing
  if((S.rpg.skillPoints.available||0)<skill.cost) return false; // insufficient points
  const prereqsMet=(skill.prerequisites||[]).every(p=>S.rpg.skillTree.unlocked.includes(p));
  if(!prereqsMet) return false;
  S.rpg.skillPoints.available-=skill.cost; // can never go negative: cost<=available was just checked
  S.rpg.skillPoints.spent+=skill.cost;
  S.rpg.skillTree.unlocked.push(id);
  S.rpg.skillTree.totalSpent+=skill.cost;
  logActivity('skill_unlock',skill.name,'Unlocked skill: '+skill.name,0);
  toast('🌟 Skill unlocked: '+skill.name);
  scheduleSave();
  return true;
}
/* ---- Phase 5: Attribute Points -- player-directed, manual spend, never negative ---- */
const ATTRIBUTE_POINT_VALUE=10; // raw attrs[] units added per spent point (5 points = 1 attribute level)
function spendAttributePoint(attrKey){
  if(!ATTRS[attrKey]) return false;
  if((S.rpg.attributePoints.available||0)<=0) return false;
  S.rpg.attributePoints.available-=1;
  S.rpg.attributePoints.spent=(S.rpg.attributePoints.spent||0)+1;
  S.attrs[attrKey]=(S.attrs[attrKey]||0)+ATTRIBUTE_POINT_VALUE;
  scheduleSave();
  return true;
}

/* ---- Phase 5: Skill effects -- each applied only from a REAL existing completion event,
   gated by that same event's own idempotent key (reusing S.xpLog as the ledger, amount:0 for
   attribute-only bonuses so S.totalXp/xpToday() are unaffected). Never a global multiplier. */
function applyCategoryAttrSkillBonus(attrKey,key){
  if(!attrKey||!key) return;
  SKILLS.filter(sk=>sk.effect&&sk.effect.type==='category_attr_bonus'&&sk.effect.attr===attrKey).forEach(sk=>{
    if(!S.rpg.skillTree.unlocked.includes(sk.id)) return;
    const bonusKey=`skillbonus:${sk.id}:${key}`;
    if(S.xpLog.some(x=>x.key===bonusKey)) return; // idempotent: never re-applied for the same event
    S.attrs[attrKey]=(S.attrs[attrKey]||0)+sk.effect.value;
    S.xpLog.push({id:uid(),amount:0,reason:'Skill bonus: '+sk.name,ts:Date.now(),key:bonusKey});
  });
}

function applyHabitStreakSkillBonus(h){
  if(h.type==='bad') return; // clean-streak bonus for bad habits not in this phase's scope
  const cur=currentStreak(h), date=todayStr();
  SKILLS.filter(sk=>sk.effect&&sk.effect.type==='habit_streak_bonus_xp').forEach(sk=>{
    if(cur!==sk.effect.milestone) return;
    if(!S.rpg.skillTree.unlocked.includes(sk.id)) return;
    // Keyed by date, not a one-time-ever key: a habit that later resets and rebuilds a fresh
    // streak to the same milestone on a DIFFERENT day earns the bonus again -- but never twice
    // for the same day's completion (edit/reload/re-render all reuse this exact key).
    grantXp(sk.effect.value,'Skill bonus: '+sk.name+' ('+h.name+')',null,`skillbonus:${sk.id}:habit:${h.id}:${date}`);
  });
}
function waterOnDate(date){return S.waterLog.filter(w=>w.date===date).reduce((a,b)=>a+Number(b.amount||0),0);}
function waterToday(s){return waterOnDate(todayStr());}
function monthBalance(s){
  const ym=todayStr().slice(0,7);
  const inc=s.income.filter(i=>i.date&&i.date.startsWith(ym)).reduce((a,b)=>a+Number(b.amount||0),0);
  const exp=s.expenses.filter(e=>e.date&&e.date.startsWith(ym)).reduce((a,b)=>a+Number(b.amount||0),0);
  return inc-exp;
}

function migrateHabit(h){
  // v3->v4: legacy habit records only had {id,name,category,icon,completions,active,createdAt}.
  // Fill in every new field with a safe default WITHOUT touching existing values, so
  // completion history (h.completions) and identity (h.id) are never lost or altered.
  const withDefaults=Object.assign({
    description:'', icon:'🔥', color:'', category:h.category||'',
    type:'good', frequency:'daily', target:1, weekdays:[], reminder:'',
    xpReward:15, attrReward:(CATS[h.category]&&CATS[h.category].a)||'DEX',
    startDate: h.createdAt ? new Date(h.createdAt).toISOString().slice(0,10) : todayStr(),
    active:true, goalId:'', completions:[], brokenDates:[], createdAt:Date.now()
  }, h);
  return withDefaults;
}
/* ---- v4->v5 per-record migrations (Phase 3): every helper only ADDS missing fields via
   Object.assign(defaults, record) — the record's own existing values always win, so ids,
   createdAt and every already-stored value survive untouched. Idempotent: re-running on an
   already-migrated record is a safe no-op. ---- */
function migrateEvent(e){
  return Object.assign({
    description:'', start:e.time||'', end:'', location:'', category:'', recurring:'none',
    reminder:'', linkedTaskId:'', linkedGoalId:'', linkedHabitId:'', createdAt:Date.now()
  }, e);
}
function migrateFinanceEntry(f){
  return Object.assign({description:'', paymentMethod:'', recurring:false, tags:[], createdAt:Date.now()}, f);
}
function migrateBudget(b){
  return Object.assign({period:'Monthly', createdAt:Date.now()}, b);
}
function migrateSub(s){
  return Object.assign({category:'', notes:'', active:true, createdAt:Date.now()}, s);
}
function migrateWorkout(w){
  const withDefaults=Object.assign({notes:'', createdAt:Date.now()}, w);
  withDefaults.exercises=(withDefaults.exercises||[]).map(ex=>Object.assign({id:uid(),muscle:'',rpe:'',rest:''},ex));
  return withDefaults;
}
function migrateMeal(m){
  return Object.assign({servings:1, notes:'', createdAt:Date.now()}, m);
}
function migrateNote(n){
  return Object.assign({tags:[], favorite:false, updatedAt:n.createdAt||Date.now(), createdAt:Date.now()}, n);

function migrateVehicle(v){

function migrateFuel(f){

/* ---- Phase 7: Health per-record migrations. Same idempotent Object.assign(defaults, record)
   pattern as every other module -- the record's own values always win, ids/dates/history never
   touched. sleepLog existed since an earlier phase (add-only, {id,date,bedtime,wake,quality,
   createdAt}) and simply gains `notes`; the other four logs are brand new so old backups
   never have any records to migrate here at all (their arrays are freshly created empty via
   the generic top-level Object.keys(d) fill-in in migrate() below). ---- */
function migrateSleepEntry(s){
  return Object.assign({notes:'', quality:null, createdAt:Date.now()}, s);

function migrateWeightEntry(w){

function migrateStepsEntry(st){

function migrate(state){
  // v1->v2: ensure all collections from later modules exist (safe defaults for old backups)
  const d=defaultState();
  const merged=Object.assign({},d,state);
  Object.keys(d).forEach(k=>{ if(merged[k]===undefined) merged[k]=d[k]; });
  // v3->v4: upgrade every habit record to the richer model (see migrateHabit). This runs on
  // every load (idempotent — already-migrated habits pass through Object.assign unchanged)
  // so old backups gain the new fields without losing any completion history.
  merged.habits=(merged.habits||[]).map(migrateHabit);
  // v4->v5 (Phase 3): upgrade every record in the modules that gained new editable fields.
  // Same idempotent Object.assign-with-defaults pattern — no ids, no completions/xpLog
  // entries, no linked-record references are ever touched or lost.
  merged.events=(merged.events||[]).map(migrateEvent);
  merged.expenses=(merged.expenses||[]).map(migrateFinanceEntry);
  merged.income=(merged.income||[]).map(migrateFinanceEntry);
  merged.budgets=(merged.budgets||[]).map(migrateBudget);
  merged.subscriptions=(merged.subscriptions||[]).map(migrateSub);
  merged.workouts=(merged.workouts||[]).map(migrateWorkout);
  merged.meals=(merged.meals||[]).map(migrateMeal);
  merged.notes=(merged.notes||[]).map(migrateNote);
  merged.journal=(merged.journal||[]).map(migrateJournalEntry);
  merged.vehicles=(merged.vehicles||[]).map(migrateVehicle);
  merged.carServices=(merged.carServices||[]).map(migrateService);
  merged.fuelEntries=(merged.fuelEntries||[]).map(migrateFuel);
  // v5->v6 (Phase 5): real RPG system. merged.rpg/merged.achievementUnlockedAt already default
  // to a fresh, empty structure via the top-level Object.keys(d) fill-in above when totally
  // absent (a v5-or-earlier backup never had these keys at all) -- nothing pre-existing is
  // overwritten or lost. Guard against a partially-shaped legacy value defensively too.
  if(!merged.rpg || typeof merged.rpg!=='object') merged.rpg=d.rpg;
  merged.rpg.skillPoints=Object.assign({available:0,earned:0,spent:0},merged.rpg.skillPoints||{});
  merged.rpg.attributePoints=Object.assign({available:0,earned:0,spent:0},merged.rpg.attributePoints||{});
  merged.rpg.skillTree=Object.assign({unlocked:[],totalSpent:0},merged.rpg.skillTree||{});
  merged.rpg.activityLog=merged.rpg.activityLog||[];
  merged.rpg.highestLevelRewarded=merged.rpg.highestLevelRewarded||1;
  merged.achievementUnlockedAt=merged.achievementUnlockedAt||{};
  // Backfill: an account that already reached a level before Phase 5 existed gets its Skill
  // Points / Attribute Points retroactively, computed purely from its real, existing totalXp
  // (never a fabricated number) -- idempotent, since re-running migrate() again is then a no-op.
  applyLevelRewards(merged);
  // v6->v7 (Phase 6): Settings / Notifications / Onboarding / Daily targets. The top-level
  // Object.assign({},d,state) above already replaced merged.settings wholesale with the OLD
  // settings object when state had one (shallow overwrite), so it is missing every new
  // sub-field -- deep-merge each level explicitly, exactly like the rpg block above, so no
  // existing setting (theme, onboarded, widgets show/hide) is ever lost or reset.
  merged.settings=Object.assign({},d.settings,merged.settings||{});
  merged.settings.widgets=Object.assign({},d.settings.widgets,merged.settings.widgets||{});
  {
    // widgetOrder: keep the account's own order for widgets it already knows about, then
    // append any brand-new widget keys (or a totally-missing order) in the default position.
    const existingOrder=(merged.settings.widgetOrder||[]).filter(k=>d.settings.widgets.hasOwnProperty(k));
    d.settings.widgetOrder.forEach(k=>{ if(!existingOrder.includes(k)) existingOrder.push(k); });
    merged.settings.widgetOrder=existingOrder;
  }
  merged.settings.notifications=Object.assign({},d.settings.notifications,merged.settings.notifications||{});
  if(!merged.settings.notificationsPermission) merged.settings.notificationsPermission=d.settings.notificationsPermission;
  merged.profile=Object.assign({},d.profile,merged.profile||{});
  merged.dailyTargets=Object.assign({},d.dailyTargets,merged.dailyTargets||{});
  merged.notificationLog=merged.notificationLog||[];
  // v7->v8 (Phase 7): Health model. sleepLog gains `notes` (+`quality` normalized); the four
  // other logs are brand-new top-level arrays -- already defaulted to [] by the generic
  // Object.keys(d) fill-in above when totally absent, so no data is ever lost or invented.
  merged.sleepLog=(merged.sleepLog||[]).map(migrateSleepEntry);
  merged.weightLog=(merged.weightLog||[]).map(migrateWeightEntry);
  merged.stepsLog=(merged.stepsLog||[]).map(migrateStepsEntry);
  merged.heartRateLog=(merged.heartRateLog||[]).map(migrateHeartRateEntry);
  merged.activeCaloriesLog=(merged.activeCaloriesLog||[]).map(migrateActiveCaloriesEntry);
  merged.schemaVersion=d.schemaVersion;
  return merged;
}

// ---- Date/time display formatting. Internal storage is ALWAYS the plain ISO 'YYYY-MM-DD' /
// 'HH:MM' string, unaffected by these settings -- only what's painted on screen changes, so
// changing the setting never rewrites or migrates a single stored record. ----
function formatDateDisplay(iso){
  if(!iso) return '';
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if(!m) return iso;
  const [,y,mo,d]=m;
  const fmt=(S&&S.settings&&S.settings.dateFormat)||'DD.MM.YYYY';
  if(fmt==='YYYY-MM-DD') return `${y}-${mo}-${d}`;
  if(fmt==='DD.MM.YYYY') return `${d}.${mo}.${y}`;
  // 'locale'/default fallback: let the browser render its own locale-appropriate format.
  try{ return new Date(iso+'T00:00').toLocaleDateString(); }catch(e){ return `${d}.${mo}.${y}`; }
}
function formatTimeDisplay(hhmm){
  if(!hhmm) return '';
  const m=/^(\d{1,2}):(\d{2})/.exec(hhmm);
  if(!m) return hhmm;
  const fmt=(S&&S.settings&&S.settings.timeFormat)||'24h';
  if(fmt==='24h') return `${String(m[1]).padStart(2,'0')}:${m[2]}`;
  let h=parseInt(m[1],10); const ap=h>=12?'PM':'AM'; h=h%12; if(h===0) h=12;
  return `${h}:${m[2]} ${ap}`;
}

// ---- Dashboard widget order: a single ordered list of widget keys, persisted in
// S.settings.widgetOrder. moveWidget just swaps two adjacent entries -- no drag-and-drop
// needed, matching the spec's explicit "stačí ↑ / ↓". ----
function moveWidget(key,dir){
  const order=(S.settings.widgetOrder&&S.settings.widgetOrder.length)?S.settings.widgetOrder.slice():WIDGET_DEFS.map(w=>w.key);
  const i=order.indexOf(key);
  if(i<0) return false;
  const j=i+dir;
  if(j<0||j>=order.length) return false;
  const tmp=order[i]; order[i]=order[j]; order[j]=tmp;
  S.settings.widgetOrder=order;
  return true;
}

// ---- Reminder engine: the single place that evaluates every kind of reminder in the app,
// from real stored data only -- no fabricated/example reminders. Each entry also carries the
// exact type+id needed to navigate to the real object via the existing searchNavigate(). ----
function getActiveReminders(now){
  const ds = now ? (now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')) : todayStr();
  const N=(S.settings&&S.settings.notifications)||{};
  const out=[];
  if(N.task!==false){
    S.tasks.filter(x=>!x.done && x.dueDate && x.dueDate<ds).forEach(x=>out.push({prefType:'task',navType:'task',id:x.id,text:`⏰ Overdue: ${x.title}`}));
  }
  if(N.event!==false){
    S.events.filter(x=>x.date===ds).forEach(x=>out.push({prefType:'event',navType:'event',id:x.id,text:`📅 Today: ${x.title}${x.start?' at '+formatTimeDisplay(x.start):''}`}));
    S.events.map(x=>({x,next:eventUpcomingDate(x)})).filter(o=>o.next && o.next>ds).forEach(({x,next})=>{
      const diff=Math.round((new Date(next)-new Date(ds))/86400000);
      if(diff>=1&&diff<=3) out.push({prefType:'event',navType:'event',id:x.id,text:`📅 ${x.title} in ${diff}d`});
    });
  }
  if(N.habit!==false){
    S.habits.filter(x=>x.active!==false && x.reminder && !isDayComplete(x,ds)).forEach(x=>out.push({prefType:'habit',navType:'habit',id:x.id,text:`🔥 Habit: ${x.name} (${formatTimeDisplay(x.reminder)})`}));
  }
  if(N.subscription!==false){
    S.subscriptions.filter(x=>x.active!==false).forEach(x=>{
      const n=nextPaymentDate(x); if(!n) return;
      const diff=Math.round((new Date(n)-new Date(ds))/86400000);
      if(diff>=0&&diff<=3) out.push({prefType:'subscription',navType:'subscription',id:x.id,text:`💳 ${x.name} renews ${diff===0?'today':'in '+diff+'d'}`});
    });
  }
  if(N.car!==false){
    S.vehicles.forEach(v=>{ carReminders(v).forEach(r=>out.push({prefType:'car',navType:'vehicle',id:v.id,text:r})); });
  }
  if(N.goal!==false){
    S.goals.filter(x=>x.status==='Active' && x.targetDate).forEach(x=>{
      const diff=Math.round((new Date(x.targetDate)-new Date(ds))/86400000);
      if(diff>=0&&diff<=7) out.push({prefType:'goal',navType:'goal',id:x.id,text:`🎯 Goal due: ${x.title} (${diff}d)`});
    });
  }
  if(N.quest!==false){
    DAILY_QUESTS.forEach(q=>{
      const key=questKey(q.id,'daily');
      if(!S.quests.some(x=>x.key===key)) out.push({prefType:'quest',navType:'quest',id:q.id,text:`📜 Quest: ${q.title}`});
    });
  }
  return out;
}
function resolveReminderEntity(navType,id){
  const map={task:S.tasks,event:S.events,habit:S.habits,subscription:S.subscriptions,vehicle:S.vehicles,goal:S.goals};
  const arr=map[navType];
  return arr?arr.find(x=>x.id===id):null;
}

function notificationsSupported(){ return typeof Notification!=='undefined'; }
function requestNotificationPermission(){
  return new Promise(resolve=>{
    if(!notificationsSupported()){ resolve('unsupported'); return; }
    try{
      const res=Notification.requestPermission(resolve); // legacy callback form (old Safari)
      if(res && typeof res.then==='function') res.then(resolve).catch(()=>resolve('denied'));
    }catch(e){ resolve('denied'); }
  });
}
function enableNotificationsClick(){
  requestNotificationPermission().then(p=>{
    S.settings.notificationsPermission=p;
    scheduleSave(); render();
    toast(p==='granted'?tr('notif_granted'):p==='unsupported'?tr('notif_unsupported'):tr('notif_denied'));
  });
}
// Idempotent: a given key (e.g. "notification:task:<id>:<date>") is only ever actually shown
// once -- re-checking the same reminder later the same period is always a safe no-op.
function sendBrowserNotification(title,body,key){
  if(!notificationsSupported()) return false;
  if(Notification.permission!=='granted') return false;
  if(key){
    if(S.notificationLog.some(n=>n.key===key)) return false;
    S.notificationLog.push({key,ts:Date.now()});
    if(S.notificationLog.length>500) S.notificationLog=S.notificationLog.slice(-500);
  }
  try{ new Notification(title,{body}); }catch(e){ return false; }
  return true;
}
// Fires real, deduped browser notifications for every currently-active, preference-enabled
// reminder. Safe to call as often as needed (render, boot, the minute-tick) -- the idempotency
// key ensures the same reminder is never shown twice within the same day.
function checkBrowserNotifications(){
  if(!S || !notificationsSupported() || Notification.permission!=='granted') return;
  const ds=todayStr();
  getActiveReminders().forEach(r=>{
    sendBrowserNotification('LifeOS', r.text, `notification:${r.prefType}:${r.id}:${ds}`);
  });
}

function addDays(dstr,n){const d=new Date(dstr+'T00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ---- Habit frequency / completion model (Phase 2) ----
   h.frequency: 'daily' | 'weekdays' | 'weekly' | 'custom'
   h.target: for daily/weekdays, "completion units per day" (e.g. water 8x/day); for
             weekly/custom, "completion days per week" (e.g. workout 3x/week).
   h.completions: array of YYYY-MM-DD strings. May contain the SAME date more than once
             for counter-style daily habits (target>1) — each push is one unit that day.
   h.brokenDates: (bad habits only) explicit "broke it" log, separate from completions
             ("maintained/clean" log), so both are real user-entered facts, never inferred. */
function isScheduledDate(h,dateStr){
  if(h.frequency==='weekdays'){
    const dow=new Date(dateStr+'T00:00').getDay(); // 0=Sun..6=Sat
    return (h.weekdays||[]).includes(dow);
  }
  return true; // daily, weekly, custom: every calendar day is a valid tracking day
}
function habitUsesDayCounter(h){ return h.type!=='bad' && (h.frequency==='daily'||h.frequency==='weekdays') && (h.target||1)>1; }
function isDayComplete(h,dateStr){
  if(h.type==='bad') return (h.completions||[]).includes(dateStr); // explicit "clean" log for that day
  if(habitUsesDayCounter(h)) return (h.completions||[]).filter(d=>d===dateStr).length>=(h.target||1);
  return (h.completions||[]).includes(dateStr);
}
function habitWeekStart(dateStr){
  const d=new Date(dateStr+'T00:00'); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function habitWeekCount(h,weekStartDate){
  const we=addDays(weekStartDate,7);
  return [...new Set((h.completions||[]).filter(d=>d>=weekStartDate&&d<we))].length;
}
function habitWeekMeetsTarget(h,weekStartDate){ return habitWeekCount(h,weekStartDate)>=(h.target||1); }

function bestStreakDaily(h){
  const days=[...new Set((h.completions||[]).filter(d=>isDayComplete(h,d)))].sort();
  if(!days.length) return 0;
  let best=1,cur=1;
  for(let i=1;i<days.length;i++){
    const prev=new Date(days[i-1]+'T00:00'), cur2=new Date(days[i]+'T00:00');
    if((cur2-prev)/86400000===1){cur++;best=Math.max(best,cur);}else{cur=1;}
  }
  return isDayComplete(h,todayStr())||isDayComplete(h,addDays(todayStr(),-1))?best:0;
}
function currentStreakDaily(h){
  let d=todayStr(),n=0,guard=0;
  if(!isDayComplete(h,d)) d=addDays(d,-1); // grace: streak still counts if not done *today* yet
  while(isDayComplete(h,d)&&guard<3660){n++;d=addDays(d,-1);guard++;}
  return n;
}
function currentStreakWeekdays(h){
  let d=todayStr();
  if(isScheduledDate(h,d)&&!isDayComplete(h,d)) d=addDays(d,-1); // grace for today
  let n=0,guard=0;
  while(guard<3660){
    if(h.startDate && d<h.startDate) break;
    if(isScheduledDate(h,d)){ if(isDayComplete(h,d)){n++;d=addDays(d,-1);} else break; }
    else d=addDays(d,-1);
    guard++;
  }
  return n;
}
function bestStreakWeekdays(h){
  const doneScheduled=[...new Set((h.completions||[]).filter(d=>isScheduledDate(h,d)&&isDayComplete(h,d)))].sort();
  if(!doneScheduled.length) return 0;
  const start=h.startDate&&h.startDate<doneScheduled[0]?h.startDate:doneScheduled[0];
  let d=start,best=0,cur=0,guard=0;
  while(d<=todayStr()&&guard<3660){
    if(isScheduledDate(h,d)){ if(isDayComplete(h,d)){cur++;best=Math.max(best,cur);} else cur=0; }
    d=addDays(d,1); guard++;
  }
  // "still active" grace, mirroring the daily behavior: only report a nonzero best streak
  // if one of the two most recent *scheduled* occurrences (up to and including today) was done.
  const recent=[]; let dd=todayStr(),g2=0;
  while(recent.length<2&&g2<3660){ if(isScheduledDate(h,dd)) recent.push(dd); dd=addDays(dd,-1); g2++; }
  return recent.some(rd=>isDayComplete(h,rd))?best:0;
}
function currentStreakWeekly(h){
  let ws=habitWeekStart(todayStr()),n=0,guard=0;
  if(!habitWeekMeetsTarget(h,ws)) ws=addDays(ws,-7); // this week not finished yet — don't break the streak on it
  const floorWeek=h.startDate?habitWeekStart(h.startDate):null;
  while(guard<520){
    if(floorWeek && ws<floorWeek) break;
    if(habitWeekMeetsTarget(h,ws)){ n++; ws=addDays(ws,-7); } else break;
    guard++;
  }
  return n;
}
function bestStreakWeekly(h){
  const dates=[...new Set(h.completions||[])].sort();
  const startWeek=habitWeekStart(h.startDate||dates[0]||todayStr());
  const thisWeek=habitWeekStart(todayStr());
  let ws=startWeek,best=0,cur=0,guard=0;
  while(ws<=thisWeek&&guard<520){
    if(habitWeekMeetsTarget(h,ws)){cur++;best=Math.max(best,cur);} else cur=0;
    ws=addDays(ws,7); guard++;
  }
  return best;
}
function bestStreak(h){
  if(h.frequency==='weekdays') return bestStreakWeekdays(h);
  if(h.frequency==='weekly'||h.frequency==='custom') return bestStreakWeekly(h);
  return bestStreakDaily(h);
}
function currentStreak(h){
  if(h.frequency==='weekdays') return currentStreakWeekdays(h);
  if(h.frequency==='weekly'||h.frequency==='custom') return currentStreakWeekly(h);
  return currentStreakDaily(h);
}
function habitProgressLabel(h){
  if(h.type==='bad') return `${currentStreakDaily(h)}d clean streak`;
  if(h.frequency==='weekly'||h.frequency==='custom'){
    const c=habitWeekCount(h,habitWeekStart(todayStr()));
    return `${Math.min(c,h.target||1)} / ${h.target||1} this week`;
  }
  if(habitUsesDayCounter(h)){
    const c=(h.completions||[]).filter(d=>d===todayStr()).length;
    return `${Math.min(c,h.target)} / ${h.target} today`;
  }
  return `🔥${currentStreak(h)} day streak`;
}

function grantXp(amount, reason, attrKey, key){
  // Idempotency guard: if a unique event key is given (e.g. "task:<id>:<date>",
  // "habit:<id>:<date>", "milestone:<id>"), refuse to grant it twice. This checks
  // real xpLog history, not UI/toggle state, so it survives reload and app restarts.
  if(key && S.xpLog.some(x=>x.key===key)) return false;
  S.totalXp += amount;
  S.xpLog.push({id:uid(),amount,reason,ts:Date.now(),key});
  if(attrKey && ATTRS[attrKey]) S.attrs[attrKey]=(S.attrs[attrKey]||0)+Math.round(amount*0.6);
  toast(`+${amount} XP · ${reason}`);
  checkAchievements();
  checkLevelUp();
  return true;
}
let lastLevelSeen=null;
function checkLevelUp(){
  const {level}=levelFromXp(S.totalXp);
  if(lastLevelSeen===null) lastLevelSeen=level;
  if(level>lastLevelSeen){
    // Phase 6: the "animation" for a level-up in this app IS this toast (there is no separate
    // confetti/visual layer) -- animations:false suppresses just that, never the real reward.
    if(animationsOn()) toast(`🎉 Level Up! You're now Level ${level}`);
    if(S.settings.notifications && S.settings.notifications.levelup!==false){
      sendBrowserNotification('⬆️ Level Up!', `You're now Level ${level}`, `notification:levelup:${level}:once`);
    }
    lastLevelSeen=level;
  }
  // Phase 5: persisted, idempotent Skill Point / Attribute Point reward -- independent of the
  // transient lastLevelSeen above, so it is correct even across reload (see applyLevelRewards).
  applyLevelRewards(S);
}
function checkAchievements(){
  ACHV.forEach(a=>{
    if(!S.achievementsUnlocked.includes(a.id) && a.cond(S)){
      S.achievementsUnlocked.push(a.id);
      S.achievementUnlockedAt[a.id]=Date.now(); // Phase 5: real unlock timestamp, set exactly once
      // Phase 6: animations:false suppresses only this toast -- the unlock itself (below) always happens.
      if(animationsOn()) toast(`🏆 Achievement: ${a.title}`);
      if(S.settings.notifications && S.settings.notifications.achievement!==false){
        sendBrowserNotification('🏆 Achievement unlocked', a.title, `notification:achievement:${a.id}:once`);
      }
      logActivity('achievement',a.title,a.desc,a.xp||0);
      if(a.xp) grantXp(a.xp,'Achievement');
    }
  });
}

  // nothing to show, or is hidden, simply contributes nothing) -- appended in the order given

    },
    goals: ()=>{

      if(!activeGoals.length) return null;

      activeGoals.forEach(g=>gl.appendChild(goalMini(g)));

    // --- Nutrition widget: real today's totals vs real targets. Empty state if nothing logged

    },
    // --- Fitness widget: real workout history only; nothing shown/fabricated without data. ---
    fitness: ()=>{
      if(W.fitness===false) return null;
      const todayWorkout=S.workouts.find(w=>w.date===todayStr());
      const sorted=[...S.workouts].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      const last=sorted[0];

    health: ()=>{

      } else {
        const today=todayStr();
        const sleepToday=S.sleepLog.find(s=>s.date===today);
        const stepsToday=S.stepsLog.find(s=>s.date===today);
        const latestWeight=[...S.weightLog].sort((a,b)=>b.date.localeCompare(a.date))[0];
        const activeCalToday=S.activeCaloriesLog.find(a=>a.date===today);
        if(sleepToday) hc.appendChild(el(`<div class="item-meta" style="margin-bottom:4px">😴 Sleep: ${sleepDuration(sleepToday)}h</div>`));
        if(stepsToday) hc.appendChild(el(`<div class="item-meta" style="margin-bottom:4px">👟 Steps: ${Number(stepsToday.steps).toLocaleString()}</div>`));
        if(latestWeight) hc.appendChild(el(`<div class="item-meta" style="margin-bottom:4px">⚖️ Weight: ${latestWeight.weight}${latestWeight.unit||'kg'} (${fmtDate(latestWeight.date)})</div>`));

      hc.style.cursor='pointer';
      return hc;
    },
  };

  const order=(S.settings.widgetOrder&&S.settings.widgetOrder.length)?S.settings.widgetOrder:WIDGET_DEFS.map(w=>w.key);
  const seen=new Set();
  order.forEach(k=>{
    if(seen.has(k)) return; seen.add(k);
    const build=builders[k];
    if(!build) return; // unknown/future widget key -- never breaks the dashboard
    const node=build();
    if(node) wrap.appendChild(node);
  });
  // Any widget not present in a legacy/partial order still renders (never silently dropped).
  Object.keys(builders).forEach(k=>{
    if(seen.has(k)) return;
    const node=builders[k]();
    if(node) wrap.appendChild(node);
  });
  return wrap;
}

/* ---- Habit completion actions (Phase 2) — the ONLY places that mutate h.completions /
   h.brokenDates or call grantXp for a habit, so every UI entry point (Home widget, Habits
   list, Habit detail) shares the exact same idempotent logic instead of re-implementing it
   (that divergence was the root cause of the Phase 1 XP-duplication bug). */
function toggleHabitDay(h){
  // good habit, target<=1 (boolean per-day completion)
  h.completions=h.completions||[];
  const date=todayStr();
  const idx=h.completions.indexOf(date);
  if(idx>=0){ h.completions.splice(idx,1); } // uncheck: never deducts XP already granted
  else {
    h.completions.push(date);
    const attrKey=(CATS[h.category]||{a:h.attrReward||'DEX'}).a;
    const key=`habit:${h.id}:${date}`;
    const granted=grantXp(h.xpReward||15,'Habit: '+h.name,attrKey,key);
    if(granted){ applyCategoryAttrSkillBonus(attrKey,key); applyHabitStreakSkillBonus(h); }
  }
  scheduleSave();render();
}
function incrementHabitToday(h){
  // good habit, target>1 (counter-style, e.g. "Drink water" 8x/day)
  h.completions=h.completions||[];
  const date=todayStr();
  const count=h.completions.filter(d=>d===date).length;
  if(count>=(h.target||1)) return; // already at target — extra taps are no-ops, not extra XP
  h.completions.push(date);
  if(count+1>=(h.target||1)){
    const attrKey=(CATS[h.category]||{a:h.attrReward||'DEX'}).a;
    const key=`habit:${h.id}:${date}`;
    const granted=grantXp(h.xpReward||15,'Habit: '+h.name,attrKey,key);
    if(granted){ applyCategoryAttrSkillBonus(attrKey,key); applyHabitStreakSkillBonus(h); }
  }
  scheduleSave();render();
}
function decrementHabitToday(h){
  h.completions=h.completions||[];
  const date=todayStr();
  const idx=h.completions.lastIndexOf(date);
  if(idx>=0) h.completions.splice(idx,1); // never removes already-granted XP from the ledger
  scheduleSave();render();
}
function markHabitClean(h,dateStr){
  // bad habit: log "maintained" for a day. Idempotent XP via the same per-day key style.
  h.completions=h.completions||[]; h.brokenDates=h.brokenDates||[];
  const bi=h.brokenDates.indexOf(dateStr); if(bi>=0) h.brokenDates.splice(bi,1);
  if(!h.completions.includes(dateStr)){
    h.completions.push(dateStr);
    const attrKey=(CATS[h.category]||{a:h.attrReward||'DEX'}).a;
    const key=`habit:${h.id}:${dateStr}`;
    const granted=grantXp(h.xpReward||15,'Habit: '+h.name,attrKey,key);
    if(granted) applyCategoryAttrSkillBonus(attrKey,key);
  }
  scheduleSave();render();
}
function markHabitBroken(h,dateStr){
  // bad habit: log "broke it". Never calls grantXp, and never un-grants a day's XP that was
  // already logged as clean in the past — it only affects this day's own log going forward.
  h.completions=h.completions||[]; h.brokenDates=h.brokenDates||[];
  const ci=h.completions.indexOf(dateStr); if(ci>=0) h.completions.splice(ci,1);
  if(!h.brokenDates.includes(dateStr)) h.brokenDates.push(dateStr);
  scheduleSave();render();
}
function habitItem(h){
  const done=isDayComplete(h,todayStr());
  // Resolved by ID — a deleted goal simply yields null and the chip is omitted (no crash).
  const linkedGoal=h.goalId?S.goals.find(g=>g.id===h.goalId):null;
  const it=el(`<div class="item">
    <button class="check ${done?'done':''}">${done?'✓':''}</button>
    <div style="flex:1;min-width:0">

    </div>
    <button class="delbtn" aria-label="Delete">✕</button>

function goalMini(g){
  // Uses the one real goalProgress() function — no second/parallel progress calculation.
  const pct=goalProgress(g);
  const nextMs=S.milestones.filter(m=>m.goalId===g.id && !m.completed).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))[0];
  const metaBits=[g.targetDate?'by '+fmtDate(g.targetDate):'',nextMs?'next: '+escapeHtml(nextMs.title):''].filter(Boolean).join(' · ');
  const it=el(`<div style="margin-bottom:10px;cursor:pointer" class="goalMiniTap">
    <div class="between"><span class="item-title">🎯 ${escapeHtml(g.title)}</span><span class="sub">${pct}%</span></div>
    <div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div>
    ${metaBits?`<div class="item-meta" style="margin-top:4px">${metaBits}</div>`:''}
  </div>`);
  it.onclick=()=>{currentGoalId=g.id;view='goalDetail';render();};
  return it;
}
function habitProgressPct(h){
  // Rough completion rate over the last 30 days (or since startDate if younger), used only as
  // this habit's contribution to a linked goal's auto progress — real data, not a guess.
  const start=h.startDate&&h.startDate>addDays(todayStr(),-29)?h.startDate:addDays(todayStr(),-29);
  let total=0,done=0,d=start,guard=0;
  while(d<=todayStr()&&guard<40){
    if(h.type==='bad'){ total++; if(!(h.brokenDates||[]).includes(d)) done++; }
    else if(isScheduledDate(h,d)){ total++; if(isDayComplete(h,d)) done++; }
    d=addDays(d,1); guard++;
  }
  return total?Math.round(done/total*100):0;
}
function goalProgress(g){
  if(g.status==='Completed')return 100;
  if(g.mode==='manual') return Math.max(0,Math.min(100,Math.round(g.manualProgress||0)));
  // auto mode: linked tasks > milestones > linked habits > last manual value set
  const linkedTasks=S.tasks.filter(t=>t.goalId===g.id);
  if(linkedTasks.length) return Math.round(linkedTasks.filter(t=>t.done).length/linkedTasks.length*100);
  const linkedMilestones=S.milestones.filter(m=>m.goalId===g.id);
  if(linkedMilestones.length) return Math.round(linkedMilestones.filter(m=>m.completed).length/linkedMilestones.length*100);
  const linkedHabits=S.habits.filter(h=>h.goalId===g.id);
  if(linkedHabits.length) return Math.round(linkedHabits.reduce((a,h)=>a+habitProgressPct(h),0)/linkedHabits.length);
  return Math.max(0,Math.min(100,Math.round(g.manualProgress||0)));
}
function completeGoal(g){
  // Idempotent: a goal's completion XP is granted at most once ever (not per-day, since
  // goal completion is not a recurring daily event like a task/habit).
  g.status='Completed';
  grantXp(g.xpReward||200,'Goal: '+g.title,'WIS',`goal:${g.id}:complete`);
  scheduleSave();
}
function toggleMilestone(m){
  m.completed=!m.completed;
  if(m.completed){
    m.completedAt=Date.now();
    grantXp(m.xpReward||25,'Milestone: '+m.title,'WIS',`milestone:${m.id}`);
    checkAchievements();
  } else {
    m.completedAt=null; // unchecking never removes already-granted XP
  }
  scheduleSave();
}

  const progressSource=linkedTasks.length?'linked tasks':milestones.length?'milestones':linkedHabits.length?'linked habits':'manual fallback';
  const wrap=el(`<div>
    <button class="iconbtn" id="backBtn" aria-label="Back" style="margin-bottom:10px">←</button>
    <h2>🎯 ${escapeHtml(g.title)}</h2>
    <div class="card">
      <div class="sub">${escapeHtml(g.description||'')}</div>
      <div class="between" style="margin:8px 0 4px"><span class="badge">${g.status}</span><span class="sub">${g.targetDate?'by '+fmtDate(g.targetDate):''}</span></div>
      <div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div>
      <div class="sub" style="margin-top:6px">${pct}% complete · ${g.mode==='manual'?'manual progress':'automatic from '+progressSource}</div>
      <div class="row" style="gap:8px;margin-top:12px">
        <button class="pill sm" id="editGoalBtn">Edit Goal</button>
        ${g.status!=='Completed'?'<button class="pill sm doneBtn">Mark Complete</button>':''}
      </div>
    </div>
    <h3>Linked Tasks (${linkedTasks.length})</h3>
    <div class="list" id="ltList" style="margin-bottom:16px"></div>
    ${linkedHabits.length?`<h3>Linked Habits (${linkedHabits.length})</h3><div class="list" id="lhList" style="margin-bottom:16px"></div>`:''}
    <div class="between"><h3>Milestones (${milestones.filter(m=>m.completed).length}/${milestones.length})</h3></div>
    <button class="btn ghost" id="addMs" style="margin-bottom:10px">+ Add Milestone</button>
    <div class="list" id="msList"></div>
  </div>`);
  wrap.querySelector('#backBtn').onclick=()=>{view='goals';render();};
  wrap.querySelector('#editGoalBtn').onclick=()=>openGoalForm(g);
  const db=wrap.querySelector('.doneBtn'); if(db) db.onclick=()=>{completeGoal(g);render();};
  const lt=wrap.querySelector('#ltList');
  if(!linkedTasks.length) lt.appendChild(el(`<div class="empty">No tasks linked yet. Link a task to this goal from the task's edit screen.</div>`));
  linkedTasks.forEach(t=>lt.appendChild(taskItem(t)));
  const lh=wrap.querySelector('#lhList');
  if(lh) linkedHabits.forEach(h=>lh.appendChild(habitItem(h)));
  const msList=wrap.querySelector('#msList');
  if(!milestones.length) msList.appendChild(el(`<div class="empty"><div class="e">🚩</div>No milestones yet.</div>`));
  milestones.forEach(m=>{
    const it=el(`<div class="item">
      <button class="check ${m.completed?'done':''}">${m.completed?'✓':''}</button>
      <div style="flex:1"><div class="item-title ${m.completed?'done':''}">${escapeHtml(m.title)}</div>
      <div class="item-meta">${escapeHtml(m.description||'')}${m.description?' · ':''}+${m.xpReward||25} XP</div></div>
      <button class="pill sm editMs">Edit</button>
      <button class="delbtn" aria-label="Delete">✕</button>
    </div>`);
    it.querySelector('.check').onclick=()=>{toggleMilestone(m);render();};
    it.querySelector('.editMs').onclick=()=>openMilestoneForm(g.id,m);
    it.querySelector('.delbtn').onclick=()=>{S.milestones=S.milestones.filter(x=>x.id!==m.id);scheduleSave();render();};
    msList.appendChild(it);
  });
  wrap.querySelector('#addMs').onclick=()=>openMilestoneForm(g.id);
  return wrap;
}
function openMilestoneForm(goalId,existing){
  const m=existing;
  const inner=el(`<div><h3>${m?'Edit Milestone':'New Milestone'}</h3>
    <label>Title</label><input id="ms_title" value="${m?escapeHtml(m.title):''}" placeholder="e.g. Run first 5K">
    <label>Description</label><textarea id="ms_desc" rows="2">${m?escapeHtml(m.description||''):''}</textarea>
    <label>XP reward</label><input type="number" id="ms_xp" min="0" value="${m?(m.xpReward||25):25}">
    <button class="btn" id="ms_save">${m?'Save Changes':'Add Milestone'}</button>
  </div>`);
  inner.querySelector('#ms_save').onclick=()=>{
    const title=inner.querySelector('#ms_title').value.trim();
    if(!title){toast('Title required');return;}
    if(m){
      m.title=title; m.description=inner.querySelector('#ms_desc').value; m.xpReward=parseFloat(inner.querySelector('#ms_xp').value)||0;
    } else {
      S.milestones.push({id:uid(),goalId,title,description:inner.querySelector('#ms_desc').value,
        xpReward:parseFloat(inner.querySelector('#ms_xp').value)||25,completed:false,completedAt:null,createdAt:Date.now()});
    }
    scheduleSave();closeSheets();render();toast(m?'Milestone updated':'Milestone added');
  };
  openSheet(inner);
}

/* ---- Character view ---- */
function renderCharacter(){
  const {level,into,need}=levelFromXp(S.totalXp);
  const pct=Math.min(100,Math.round(into/need*100));
  const wrap=el(`<div><h2>Character</h2></div>`);
  wrap.appendChild(el(`<div class="card">
    <div class="row"><div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff">${S.profile.avatar?S.profile.avatar:(S.profile.name||'H')[0].toUpperCase()}</div>
    <div><div class="item-title" style="font-size:18px">${escapeHtml(S.profile.name)}</div><div class="sub">Level ${level} · ${S.totalXp} total XP</div></div></div>
    <div class="xp-bar" style="margin-top:12px"><i style="width:${pct}%"></i></div>
    <div class="sub" style="margin-top:6px">${into}/${need} XP to next level</div>
  </div>`));

  const ac=el(`<div class="card"><h3>Attributes</h3></div>`);
  const availAttrPts=S.rpg.attributePoints.available||0;
  if(availAttrPts>0) ac.appendChild(el(`<div class="sub" style="margin-bottom:8px">🔵 ${availAttrPts} attribute point${availAttrPts===1?'':'s'} available to spend</div>`));
  Object.keys(ATTRS).forEach(k=>{
    const val=S.attrs[k]||0; const lvl=Math.floor(val/50)+1; const into2=val%50;
    const row=el(`<div class="attr">
      <div class="dot" style="background:${ATTRS[k].c}">${k}</div>
      <div style="flex:1"><div class="between"><span class="sub">${ATTRS[k].label}</span><span class="sub">Lv ${lvl}</span></div>
      <div class="bar" style="margin-top:4px"><i style="width:${into2/50*100}%;background:${ATTRS[k].c}"></i></div></div>
      ${availAttrPts>0?`<button class="iconbtn spendAttrBtn" data-attr="${k}" title="Spend 1 point on ${k}">+</button>`:''}
    </div>`);
    ac.appendChild(row);
  });
  ac.querySelectorAll('.spendAttrBtn').forEach(b=>b.onclick=()=>{ if(spendAttributePoint(b.dataset.attr)) render(); });
  wrap.appendChild(ac);

  // ---- Phase 5: RPG summary (Skill Points / Attribute Points / streaks / badges) ----
  const bestStreakOverall=S.habits.reduce((m,h)=>Math.max(m,bestStreak(h)),0);
  const curStreakOverall=S.habits.reduce((m,h)=>Math.max(m,currentStreak(h)),0);
  const badgeSkills=SKILLS.filter(sk=>sk.effect&&sk.effect.type==='badge'&&S.rpg.skillTree.unlocked.includes(sk.id));
  const rpgC=el(`<div class="card"><h3>RPG</h3>
    <div class="grid2">
      <div class="item" style="justify-content:space-between"><span>⭐ Skill Points</span><b>${S.rpg.skillPoints.available}</b></div>
      <div class="item" style="justify-content:space-between"><span>🔵 Attribute Points</span><b>${S.rpg.attributePoints.available}</b></div>
      <div class="item" style="justify-content:space-between"><span>🏆 Achievements</span><b>${S.achievementsUnlocked.length}/${ACHV.length}</b></div>
      <div class="item" style="justify-content:space-between"><span>🌟 Skills unlocked</span><b>${S.rpg.skillTree.unlocked.length}/${SKILLS.length}</b></div>
      <div class="item" style="justify-content:space-between"><span>🔥 Current streak</span><b>${curStreakOverall}</b></div>
      <div class="item" style="justify-content:space-between"><span>🏅 Best streak</span><b>${bestStreakOverall}</b></div>
    </div>
    <div class="sub" style="margin-top:8px">Skill Points: ${S.rpg.skillPoints.earned} earned · ${S.rpg.skillPoints.spent} spent</div>
    <div class="sub">Attribute Points: ${S.rpg.attributePoints.earned} earned · ${S.rpg.attributePoints.spent} spent</div>
    ${badgeSkills.length?`<div class="sub" style="margin-top:8px">Badges: ${badgeSkills.map(b=>escapeHtml(b.effect.value)).join(' · ')}</div>`:''}
  </div>`);
  wrap.appendChild(rpgC);

  // ---- Phase 5: real Skill Tree -- unlockable, persisted, cost/prerequisites-gated ----
  const skC=el(`<div class="card"><h3>Skill Tree</h3><div class="sub" style="margin-bottom:10px">${S.rpg.skillPoints.available} skill point${S.rpg.skillPoints.available===1?'':'s'} available</div></div>`);
  Object.keys(SKILL_BRANCH_LABELS).forEach(branchKey=>{
    const attr=SKILL_BRANCH_ATTR[branchKey];
    const branchSkills=SKILLS.filter(sk=>sk.branch===branchKey);
    const branchWrap=el(`<div style="margin-bottom:14px"><div class="row" style="margin-bottom:6px"><span class="dot" style="background:${ATTRS[attr].c};width:26px;height:26px;font-size:10px">${attr}</span><b>${SKILL_BRANCH_LABELS[branchKey]}</b></div></div>`);
    branchSkills.forEach(sk=>{
      const isUnlocked=S.rpg.skillTree.unlocked.includes(sk.id);
      const prereqsMet=(sk.prerequisites||[]).every(p=>S.rpg.skillTree.unlocked.includes(p));
      const canAfford=(S.rpg.skillPoints.available||0)>=sk.cost;
      const canUnlock=!isUnlocked&&prereqsMet&&canAfford;
      const row=el(`<div class="item" style="margin:4px 0 4px 36px;opacity:${isUnlocked?1:(prereqsMet?0.85:0.4)}">
        <span style="font-size:16px">${isUnlocked?'✅':'🔒'}</span>
        <div style="flex:1"><div class="item-title" style="font-size:14px">${escapeHtml(sk.name)}</div>
        <div class="item-meta">${escapeHtml(sk.description)}${isUnlocked?'':' · cost '+sk.cost+(prereqsMet?'':' · locked (prerequisites)')}</div></div>
        ${!isUnlocked?`<button class="pill sm unlockSkillBtn" data-id="${sk.id}" ${canUnlock?'':'disabled'}>Unlock</button>`:''}
      </div>`);
      const btn=row.querySelector('.unlockSkillBtn');
      if(btn) btn.onclick=()=>{ if(unlockSkill(sk.id)) render(); };
      branchWrap.appendChild(row);
    });
    skC.appendChild(branchWrap);
  });
  wrap.appendChild(skC);

  const unlockedA=ACHV.filter(a=>S.achievementsUnlocked.includes(a.id));
  const lockedA=ACHV.filter(a=>!S.achievementsUnlocked.includes(a.id));
  const achC=el(`<div class="card"><h3>Achievements (${unlockedA.length}/${ACHV.length})</h3><div class="list" id="achl"></div></div>`);
  const al=achC.querySelector('#achl');
  unlockedA.forEach(a=>{
    const at=S.achievementUnlockedAt&&S.achievementUnlockedAt[a.id];
    al.appendChild(el(`<div class="item"><span style="font-size:20px">🏆</span><div><div class="item-title">${a.title}</div><div class="item-meta">${a.desc} · ${a.rarity}${at?' · unlocked '+new Date(at).toLocaleDateString():''}</div></div></div>`));
  });
  lockedA.forEach(a=>{
    const p=a.progress?Math.max(0,Math.min(100,a.progress(S))):0;
    al.appendChild(el(`<div class="item" style="opacity:.55;align-items:flex-start"><span style="font-size:20px">🔒</span><div style="flex:1"><div class="item-title">${a.title}</div><div class="item-meta">${a.desc} · ${a.rarity}</div><div class="bar" style="margin-top:4px"><i style="width:${p}%"></i></div></div></div>`));
  });
  wrap.appendChild(achC);

  // ---- Phase 5: RPG activity log (real events only) ----
  const actC=el(`<div class="card"><h3>Recent Activity</h3><div class="list" id="actl"></div></div>`);
  const actl=actC.querySelector('#actl');
  const recent=(S.rpg.activityLog||[]).slice(0,10);
  if(!recent.length) actl.appendChild(el(`<div class="empty">No RPG activity yet.</div>`));
  const ACTIVITY_ICON={levelup:'⬆️',skill_unlock:'🌟',achievement:'🏆',quest_complete:'📜',xp:'✨'};
  recent.forEach(a=>actl.appendChild(el(`<div class="item"><span style="font-size:16px">${ACTIVITY_ICON[a.type]||'✨'}</span><div style="flex:1"><div class="item-title" style="font-size:14px">${escapeHtml(a.title)}</div><div class="item-meta">${escapeHtml(a.description||'')}</div></div></div>`)));
  wrap.appendChild(actC);

  // Phase 6: name/avatar/widgets/export/import/reset now live in the dedicated Settings
  // screen (view='settings', reachable from the ⚙️ topbar icon or the More menu) -- this
  // just links there instead of duplicating the same controls in two places.
  const setLink=el(`<div class="card" style="cursor:pointer"><div class="between"><span>${tr('open_settings')}</span><span class="sub">›</span></div></div>`);
  setLink.onclick=()=>{view='settings';render();window.scrollTo(0,0);};
  wrap.appendChild(setLink);
  return wrap;
}

/* ---- Phase 6: Settings screen ---- */
function renderSettings(){
  const wrap=el(`<div><h2>${tr('settings_title')}</h2></div>`);

  // -- Profile: name + avatar --
  const prof=el(`<div class="card"><h3>${tr('settings_profile')}</h3>
    <label>${tr('settings_name')}</label><input id="st_name" value="${escapeHtml(S.profile.name)}" placeholder="${tr('settings_name')}">
    <div class="sub" style="margin:10px 0 6px;font-weight:600">${tr('settings_avatar')}</div>
    <div class="row" id="st_avatars" style="gap:8px;flex-wrap:wrap"></div>

  prof.querySelector('#st_name').oninput=(e)=>{S.profile.name=e.target.value;scheduleSave();};
  const avWrap=prof.querySelector('#st_avatars');
  AVATAR_CHOICES.forEach(a=>{
    const b=el(`<button class="iconbtn" style="font-size:20px;${a===S.profile.avatar?'border-color:var(--accent);border-width:2px':''}">${a}</button>`);

  wrap.appendChild(prof);

  // -- Language / Date / Time / First day of week --
  const loc=el(`<div class="card"><h3>${tr('settings_language')} & ${tr('settings_dateformat')}</h3>
    <label>${tr('settings_language')}</label>
    <select id="st_lang"><option value="cs" ${S.settings.language==='cs'?'selected':''}>Čeština</option><option value="en" ${S.settings.language==='en'?'selected':''}>English</option></select>
    <label>${tr('settings_dateformat')}</label>
    <select id="st_datefmt">
      <option value="DD.MM.YYYY" ${S.settings.dateFormat==='DD.MM.YYYY'?'selected':''}>DD.MM.YYYY</option>
      <option value="YYYY-MM-DD" ${S.settings.dateFormat==='YYYY-MM-DD'?'selected':''}>YYYY-MM-DD</option>
    </select>
    <label>${tr('settings_timeformat')}</label>
    <select id="st_timefmt">
      <option value="24h" ${S.settings.timeFormat==='24h'?'selected':''}>${tr('time_24h')}</option>
      <option value="12h" ${S.settings.timeFormat==='12h'?'selected':''}>${tr('time_12h')}</option>
    </select>
    <label>${tr('settings_firstday')}</label>
    <select id="st_fdow">
      <option value="monday" ${S.settings.firstDayOfWeek==='monday'?'selected':''}>${tr('day_monday')}</option>
      <option value="sunday" ${S.settings.firstDayOfWeek==='sunday'?'selected':''}>${tr('day_sunday')}</option>
    </select>
  </div>`);
  loc.querySelector('#st_lang').onchange=(e)=>{S.settings.language=e.target.value;scheduleSave();render();};
  loc.querySelector('#st_datefmt').onchange=(e)=>{S.settings.dateFormat=e.target.value;scheduleSave();render();};
  loc.querySelector('#st_timefmt').onchange=(e)=>{S.settings.timeFormat=e.target.value;scheduleSave();render();};
  loc.querySelector('#st_fdow').onchange=(e)=>{S.settings.firstDayOfWeek=e.target.value;scheduleSave();render();};
  wrap.appendChild(loc);

  // -- Theme --
  const th=el(`<div class="card"><h3>${tr('settings_theme')}</h3>
    <select id="st_theme">
      <option value="dark" ${S.settings.theme==='dark'?'selected':''}>${tr('theme_dark')}</option>
      <option value="light" ${S.settings.theme==='light'?'selected':''}>${tr('theme_light')}</option>
      <option value="system" ${S.settings.theme==='system'?'selected':''}>${tr('theme_system')}</option>
    </select>
  </div>`);
  th.querySelector('#st_theme').onchange=(e)=>{S.settings.theme=e.target.value;applyTheme();scheduleSave();render();};
  wrap.appendChild(th);

  // -- Dashboard widgets: show/hide + ↑/↓ reorder, in real persisted order --
  const dash=el(`<div class="card"><h3>${tr('settings_dashboard')}</h3><div id="st_widgets"></div></div>`);
  const dw=dash.querySelector('#st_widgets');
  const order=(S.settings.widgetOrder&&S.settings.widgetOrder.length)?S.settings.widgetOrder:WIDGET_DEFS.map(w=>w.key);
  const labelOf=(k)=>{const d=WIDGET_DEFS.find(w=>w.key===k);return d?d.label:k;};
  order.forEach((k,i)=>{
    const on=S.settings.widgets[k]!==false;
    const row=el(`<div class="between" style="margin-bottom:8px">
      <span class="sub">${escapeHtml(labelOf(k))}</span>
      <span class="row" style="gap:6px">
        <button class="iconbtn" style="width:32px;height:32px;font-size:14px" data-dir="-1" ${i===0?'disabled':''}>↑</button>
        <button class="iconbtn" style="width:32px;height:32px;font-size:14px" data-dir="1" ${i===order.length-1?'disabled':''}>↓</button>
        <button class="pill sm ${on?'on':''}" data-toggle="1">${on?tr('on_label'):tr('off_label')}</button>
      </span>
    </div>`);
    row.querySelector('[data-toggle]').onclick=()=>{ S.settings.widgets[k]=!on; scheduleSave(); render(); };
    row.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{ if(moveWidget(k,parseInt(b.dataset.dir,10))){ scheduleSave(); render(); } });
    dw.appendChild(row);
  });
  wrap.appendChild(dash);

  // -- Gamification: animations / sounds --
  const gam=el(`<div class="card"><h3>${tr('settings_gamification')}</h3>
    <div class="between" style="margin-bottom:8px"><span class="sub">${tr('settings_animations')}</span><button class="pill sm ${S.settings.animations!==false?'on':''}" id="st_anim">${S.settings.animations!==false?tr('on_label'):tr('off_label')}</button></div>
    <div class="between"><span class="sub">${tr('settings_sounds')}</span><button class="pill sm ${S.settings.sounds!==false?'on':''}" id="st_sound">${S.settings.sounds!==false?tr('on_label'):tr('off_label')}</button></div>
  </div>`);
  gam.querySelector('#st_anim').onclick=()=>{S.settings.animations=S.settings.animations===false;scheduleSave();render();};
  gam.querySelector('#st_sound').onclick=()=>{S.settings.sounds=S.settings.sounds===false;scheduleSave();render();};
  wrap.appendChild(gam);

  // -- Notification preferences + browser Enable button --
  const permState = notificationsSupported() ? Notification.permission : 'unsupported';
  const permText = permState==='granted'?tr('notif_granted'):permState==='denied'?tr('notif_denied'):permState==='unsupported'?tr('notif_unsupported'):tr('notif_default');
  const notif=el(`<div class="card"><h3>${tr('settings_notifications')}</h3>
    <div class="sub" style="margin-bottom:10px">${permText}</div>
    <button class="btn ghost" id="st_enable_notif" style="margin-bottom:12px" ${permState==='unsupported'?'disabled':''}>${tr('enable_notifications')}</button>
    <div id="st_notif_prefs"></div>
  </div>`);
  notif.querySelector('#st_enable_notif').onclick=enableNotificationsClick;
  const np=notif.querySelector('#st_notif_prefs');
  const NOTIF_TYPES=[['task','Task reminders'],['event','Event reminders'],['habit','Habit reminders'],['goal','Goal reminders'],
    ['subscription','Subscription reminders'],['car','Car reminders'],['quest','Quest reminders'],
    ['achievement','Achievement notifications'],['levelup','Level-up notifications']];
  NOTIF_TYPES.forEach(([k,label])=>{
    const on=S.settings.notifications[k]!==false;
    const row=el(`<div class="between" style="margin-bottom:8px"><span class="sub">${label}</span><button class="pill sm ${on?'on':''}">${on?tr('on_label'):tr('off_label')}</button></div>`);
    row.querySelector('button').onclick=()=>{ S.settings.notifications[k]=!on; scheduleSave(); render(); };
    np.appendChild(row);
  });
  wrap.appendChild(notif);

  // -- Daily targets: calories/protein/water reuse the existing nutritionTargets model
  // (no second parallel target system); only the genuinely new ones live in dailyTargets. --
  const dt=el(`<div class="card"><h3>${tr('settings_daily_targets')}</h3>
    <div class="grid2">
      <div><label>Calories</label><input type="number" id="st_cal" value="${S.nutritionTargets.calories}"></div>
      <div><label>Protein (g)</label><input type="number" id="st_prot" value="${S.nutritionTargets.protein}"></div>
      <div><label>Water (ml)</label><input type="number" id="st_water" value="${S.nutritionTargets.water}"></div>
      <div><label>Workouts/week</label><input type="number" id="st_wpw" value="${S.dailyTargets.workoutsPerWeek}"></div>
      <div><label>Tasks/day</label><input type="number" id="st_tpd" value="${S.dailyTargets.tasksPerDay}"></div>
      <div><label>Habits/day</label><input type="number" id="st_hpd" value="${S.dailyTargets.habitsPerDay}"></div>
    </div>
  </div>`);
  const bindNum=(id,setter)=>dt.querySelector(id).oninput=(e)=>{const v=parseFloat(e.target.value);if(!isNaN(v)){setter(v);scheduleSave();}};
  bindNum('#st_cal',v=>S.nutritionTargets.calories=v);
  bindNum('#st_prot',v=>S.nutritionTargets.protein=v);
  bindNum('#st_water',v=>S.nutritionTargets.water=v);
  bindNum('#st_wpw',v=>S.dailyTargets.workoutsPerWeek=v);
  bindNum('#st_tpd',v=>S.dailyTargets.tasksPerDay=v);
  bindNum('#st_hpd',v=>S.dailyTargets.habitsPerDay=v);
  wrap.appendChild(dt);

  // -- Data: export / import / reset (existing functions, unchanged) --
  const data=el(`<div class="card"><h3>${tr('settings_data')}</h3>
    <button class="btn ghost" id="st_exp" style="margin-bottom:8px">${tr('export_label')}</button>
    <input type="file" id="st_impFile" accept="application/json" class="hide">
    <button class="btn ghost" id="st_imp" style="margin-bottom:8px">${tr('import_label')}</button>
    <button class="btn ghost" id="st_reset" style="color:var(--danger)">${tr('reset_label')}</button>
  </div>`);
  data.querySelector('#st_exp').onclick=doExport;
  data.querySelector('#st_imp').onclick=()=>data.querySelector('#st_impFile').click();
  data.querySelector('#st_impFile').onchange=doImport;
  data.querySelector('#st_reset').onclick=doReset;
  wrap.appendChild(data);

  return wrap;
}

/* ---- More menu ---- */
function renderMore(){
  const wrap=el(`<div><h2>More</h2><div class="qgrid" id="moreGrid" style="grid-template-columns:1fr 1fr"></div></div>`);
  const items=[

/* ---- Finance module ---- */
function financeGrantXp(){
  const today=todayStr();
  if(S.financeXpDate!==today){
    S.financeXpDate=today; grantXp(5,'Finance logged','WIS');
    // Phase 5 skill effect: gated by the exact same once-per-day check as the XP above, so it
    // can never double-fire regardless of how many finance entries are logged that day.
    applyFinanceAttrSkillBonus('finance:'+today);
  }
}
function renderFinance(){
  const ym=todayStr().slice(0,7);
  const monthExp=S.expenses.filter(e=>e.date&&e.date.startsWith(ym));
  const monthInc=S.income.filter(i=>i.date&&i.date.startsWith(ym));
  const totExp=monthExp.reduce((a,b)=>a+Number(b.amount||0),0);
